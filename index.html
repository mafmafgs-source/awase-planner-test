<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>併せPlanner</title>
<!-- ホーム画面に追加（iPhone の Safari はしばらく開かないとデータを消すことがあるが、ホーム画面から開けば消えにくい） -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-32.png">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="併せPlanner">
<style>
:root{
  --ac:#1a1a1a; --acbg:#f2f2f2;
  --bg:#fafafa; --card:#ffffff; --tx:#1a1a1a; --sub:#767676;
  --line:#e3e3e3; --ok:#1a1a1a; --mid:#767676; --no:#d9d9d9;
  --r:8px; --sh:0 1px 3px rgba(0,0,0,.06);
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html{height:100%;}
body{min-height:100%;}
body{
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  background:var(--bg); color:var(--tx); font-size:15px; line-height:1.6;
  max-width:640px; margin:0 auto;
  padding-bottom:calc(120px + env(safe-area-inset-bottom));
}
#topStick{position:sticky; top:0; z-index:50;}
.savedbar{
  background:var(--tx); color:#fff; font-size:12.5px; font-weight:700;
  padding:9px 16px; display:flex; align-items:center; gap:10px;
}
.savedbar .open{flex:1; cursor:pointer;}
.savedbar button{
  background:none; border:1px solid rgba(255,255,255,.5); color:#fff; border-radius:5px;
  padding:3px 10px; font-size:11.5px; font-weight:700; cursor:pointer; font-family:inherit;
}
header{
  background:var(--card);
  border-bottom:1px solid var(--line); padding:12px 16px;
  display:flex; align-items:center; gap:10px;
}
header h1{font-size:16px; font-weight:700; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.hbtn{
  background:none; border:none; font-size:20px; cursor:pointer; color:var(--tx);
  padding:2px 6px; line-height:1; font-weight:700;
}
.hbtn.txt{font-size:13px; border:1px solid var(--tx); border-radius:6px; padding:5px 12px;}
/* 進捗タブに重ねるカウントダウンバッジ */
.tabcd{
  position:absolute; top:-10px; left:50%; transform:translateX(-50%) rotate(-4deg);
  background:var(--tx); color:#fff; border-radius:99px; padding:2px 10px;
  font-size:10.5px; font-weight:800; white-space:nowrap; pointer-events:none;
  box-shadow:var(--sh); letter-spacing:.02em;
}
main{padding:16px;}
/* WEB版で招待から参加した人向けの「アプリもあります」帯（控えめ・閉じられる） */
.appbanner{
  display:flex; align-items:center; gap:8px; background:var(--acbg);
  border-bottom:1px solid var(--line); padding:7px 12px 7px 16px; font-size:12px; color:var(--sub);
}
.appbanner span{flex:1; line-height:1.5;}
.appbanner a{color:var(--tx); font-weight:700; white-space:nowrap; text-decoration:none;
  border:1px solid var(--line); background:var(--card); border-radius:99px; padding:4px 10px;}
.rptlink{display:block;margin:10px auto 0;background:none;border:none;color:var(--sub);font-size:12px;text-decoration:underline;cursor:pointer;font-family:inherit;padding:4px}
.rptlink.in{display:inline;margin:0 0 0 8px;padding:0;font-size:11px}
.hidimg{display:flex;align-items:center;justify-content:center;background:var(--acbg);color:var(--sub);font-size:11px;text-align:center;padding:6px}
.rptopt{display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
.rptopt input{width:auto}
.bkhint{position:fixed; left:12px; right:12px; bottom:calc(env(safe-area-inset-bottom, 0px) + 64px); z-index:50;
  display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:12px;
  box-shadow:0 4px 16px rgba(0,0,0,.12); padding:10px 10px 10px 14px; font-size:12.5px; line-height:1.5; max-width:560px; margin:0 auto;}
.bkhint span{flex:1;}
.bkhint .go{font:inherit; font-weight:700; border:1px solid var(--tx); background:var(--tx); color:var(--card); border-radius:99px; padding:5px 12px; cursor:pointer; white-space:nowrap;}
.bkhint .x{background:none; border:none; color:var(--sub); font-size:16px; cursor:pointer; padding:2px 4px;}
.appbanner button{background:none; border:none; color:var(--sub); font-size:16px; cursor:pointer; padding:2px 4px; line-height:1;}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px; margin-bottom:14px;}
.card h3{font-size:13.5px; color:var(--tx); margin-bottom:10px; letter-spacing:.02em;}
.card h3 .cnt{color:var(--sub); font-weight:400; font-size:12px; margin-left:6px;}
label.fl{display:block; font-size:12px; color:var(--sub); margin:10px 0 4px; font-weight:600;}
input[type=text],input[type=number],input[type=datetime-local],input[type=date],input[type=time],textarea,select{
  width:100%; border:1px solid var(--line); border-radius:6px; padding:9px 12px;
  font-size:15px; background:var(--card); color:var(--tx); font-family:inherit;
}
input:focus,textarea:focus,select:focus{outline:none; border-color:var(--tx);}
textarea{resize:vertical;}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  background:var(--tx); color:#fff; border:1px solid var(--tx); border-radius:6px;
  padding:11px 18px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;
}
.btn.sec{background:var(--acbg); color:var(--tx); border-color:var(--acbg);}
.btn.ghost{background:none; border:1px solid var(--line); color:var(--sub);}
.btn.sm{padding:6px 12px; font-size:12.5px;}
.btn.wide{width:100%; margin-top:10px;}
.btn:active{opacity:.7;}
.row{display:flex; gap:8px; align-items:center;}
.row>*{flex:1;}
.row>.fix{flex:0 0 auto;}
.del{
  flex:0 0 auto; background:none; border:none; color:#b5b5b5; font-size:17px;
  cursor:pointer; padding:4px;
}
.rowbtn{
  flex:0 0 auto; background:var(--card); border:1px solid var(--line); color:var(--sub);
  font-size:10.5px; font-weight:700; border-radius:5px; padding:5px 8px;
  cursor:pointer; font-family:inherit;
}
.tabs{
  position:fixed; bottom:0; left:0; right:0; max-width:640px; margin:0 auto;
  background:var(--card); border-top:1px solid var(--line); display:flex; z-index:50;
  padding-bottom:env(safe-area-inset-bottom);
}
.tabs button{
  flex:1; background:none; border:none; padding:14px 0 12px; cursor:pointer;
  font-size:13px; color:var(--sub); font-family:inherit; font-weight:600;
  border-top:2px solid transparent; position:relative;
}
.tabs button.on{color:var(--tx); border-top-color:var(--tx); font-weight:700;}
/* home */
.evcard{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  margin-bottom:12px; cursor:pointer; overflow:hidden;
}
.evcard .inner{padding:14px 16px;}
.evcard .ttl{font-weight:700; font-size:16px;}
.evcard .meta{font-size:12.5px; color:var(--sub); margin-top:3px;}
.evcard .cdown{
  margin-top:8px; font-size:12px; font-weight:700; color:var(--tx);
  background:var(--acbg); display:inline-block; padding:3px 10px; border-radius:4px;
}
.evcard .mini{font-size:11.5px; color:var(--sub); margin-top:6px; display:flex; gap:14px;}
.empty{text-align:center; color:var(--sub); padding:60px 20px 40px; font-size:14px;}
/* chips / progress */
.pbar{height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin:6px 0;}
.pbar>div{height:100%; background:var(--tx); border-radius:3px; transition:width .3s;}
.st3{display:flex; gap:6px; margin-top:4px;}
.st3 button{
  flex:1; border:1px solid var(--line); background:var(--card); color:var(--sub);
  border-radius:6px; padding:8px 2px; font-size:12px; cursor:pointer; font-family:inherit; font-weight:600;
}
.st3 button.s1{border-color:var(--sub); color:var(--tx);}
.st3 button.s2{background:var(--tx); border-color:var(--tx); color:#fff;}
.mcard{border:1px solid var(--line); border-radius:var(--r); padding:12px; margin-bottom:10px; background:var(--card);}
.mcard.mine{border:2.5px solid var(--tx); box-shadow:var(--sh);}
.mcard .nm{font-weight:700; font-size:14.5px;}
.mcard .tw{color:var(--sub); font-size:12px; font-weight:400;}
.mytag{font-size:10px; font-weight:800; border:1px solid var(--tx); border-radius:99px; padding:1px 8px; margin-left:6px; vertical-align:2px;}
.mytag.other{color:var(--sub); border-color:var(--line);}
.claimbtn{
  margin-left:6px; font-size:10.5px; font-weight:700; border:1px solid var(--line);
  background:var(--card); color:var(--sub); border-radius:99px; padding:2px 10px;
  cursor:pointer; font-family:inherit; vertical-align:2px;
}
.st3 button:disabled{opacity:.5; cursor:default;}
/* じぶんの忘れ物チェック（固定グリッド：チェックしても位置がズレない） */
.mychips{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
.mychip{
  position:relative;
  border:1px solid var(--line); border-radius:8px; padding:8px 10px;
  min-height:54px;
  font-size:13px; font-weight:600; line-height:1.35;
  background:var(--card); color:var(--tx);
  cursor:pointer; font-family:inherit;
  display:flex; align-items:center; justify-content:center; text-align:center;
  overflow:hidden;
}
.mychip .t{
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;
  overflow:hidden; word-break:break-all;
}
.mychip.on{background:var(--tx); color:#fff; border-color:var(--tx);}
.mychip.on::after{
  content:'✓'; position:absolute; top:2px; right:6px;
  font-size:11px; font-weight:800; color:#fff;
}
.mychip.del{border-style:dashed; color:var(--sub);}
.mychip.del::after{
  content:'✕'; position:absolute; top:2px; right:6px;
  font-size:11px; font-weight:800; color:var(--sub);
}
.mychip:active{opacity:.7;}
/* 差し入れを探す（アフィリエイトは控えめに：ボタンにせず小さな文字リンク） */
.sqres{margin:10px 0 2px; padding:10px 12px; background:var(--acbg); border-radius:8px; font-size:13px; line-height:1.7;}
.sqres b{font-weight:700;}
.sqlink{color:var(--tx); text-decoration:underline; text-underline-offset:2px;}
.sqadd{background:none; border:none; color:var(--sub); font-size:12px; cursor:pointer; font-family:inherit; padding:0; text-decoration:underline; text-underline-offset:2px;}
.pr{display:inline-block; font-size:9.5px; color:var(--sub); border:1px solid var(--line); border-radius:3px; padding:0 4px; margin-left:4px; vertical-align:1px; line-height:1.5;}
.sqchips{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;}
.sqchip{background:var(--card); border:1px solid var(--line); border-radius:99px; padding:4px 11px; font-size:12.5px; color:var(--tx); cursor:pointer; font-family:inherit;}
.sqchip .rk{color:var(--sub); font-size:11px; margin-right:4px;}
.sqcat{font-size:12px; font-weight:700; color:var(--sub); margin:12px 0 2px;}
.sqrow{display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-bottom:1px dashed var(--line); font-size:13px;}
.sqrk{flex:0 0 20px; height:20px; margin-top:2px; border-radius:50%; background:var(--acbg); color:var(--sub); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center;}
.sqrk.r1{background:var(--tx); color:var(--card);}
.sqrow .tbl{flex:0 0 56px; display:block;}
.sqrow .nm{color:var(--tx); text-decoration:none; display:block; line-height:1.45;}
.sqrow .sqadd{margin-top:3px; font-size:11.5px;}
.shopbtns{flex:0 0 64px; display:flex; flex-direction:column; gap:6px; align-self:center;}
.shopbtns a{display:block; text-align:center; font-size:12px; font-weight:700; color:var(--tx); text-decoration:none;
  background:var(--card); border:1px solid var(--line); border-radius:8px; padding:7px 0;}
.shopbtns a:active{background:var(--acbg);}
.sqrow .tb{flex:0 0 56px; width:56px; height:56px; border-radius:6px; object-fit:cover; background:var(--acbg); border:1px solid var(--line);}
.sqrow .bd{flex:1; min-width:0;}
.sqrow:last-child{border-bottom:none;}
.sqrow .nt{font-size:11.5px; color:var(--sub); margin-top:1px;}
.prnote{font-size:10.5px; color:var(--sub); margin-top:12px; line-height:1.6;}
/* 撮影データの受け渡し */
.waitrow{display:flex; align-items:center; gap:8px; margin-top:8px;}
.waittag{
  font-size:11px; font-weight:800; color:var(--tx);
  background:var(--acbg); border:1px dashed var(--sub); border-radius:99px; padding:3px 10px;
}
.st3.prog3{margin-top:10px;}
.st3.prog3 button{padding:7px 2px;}
.st3.prog3 .plbl{display:block; font-size:13px; font-weight:800;}
.st3.prog3 .pst{display:block; font-size:10px; margin-top:1px; font-weight:600;}
input[readonly]{color:var(--sub);}
.plabel{font-size:11.5px; color:var(--sub); margin-top:10px; font-weight:600;}
/* countdown */
.cdbig{
  text-align:center; padding:22px 10px 18px;
  background:var(--card); border:1px solid var(--tx);
  border-radius:var(--r); margin-bottom:14px;
}
.cdbig .lbl{font-size:12px; color:var(--sub); font-weight:700; letter-spacing:.15em;}
.cdbig .num{font-size:40px; font-weight:800; line-height:1.25;}
.cdbig .sub{font-size:12.5px; color:var(--sub); margin-top:2px;}
/* カウントダウンの背景画像 */
.cdbig{position:relative;}
.cdbig.hasbg{
  background-size:cover; background-position:center;
  overflow:hidden; color:#fff;
}
.cdbig.hasbg::before{content:''; position:absolute; inset:0; background:rgba(0,0,0,.44);}
.cdbig.hasbg>*{position:relative;}
.cdbig.hasbg .lbl, .cdbig.hasbg .sub{color:rgba(255,255,255,.92);}
.cdbig .bgbtns{position:absolute; top:8px; right:8px; display:flex; gap:5px;}
.cdbig .bgbtns button{
  font-size:10px; font-weight:700; padding:3px 9px; border-radius:99px;
  border:1px solid var(--line); background:rgba(255,255,255,.85); color:var(--sub);
  cursor:pointer; font-family:inherit;
}
.cdbig.hasbg .bgbtns button{
  border-color:rgba(255,255,255,.5); background:rgba(0,0,0,.35); color:#fff;
}
/* 併せ一覧カードの背景 */
.evcard.hasbg{background-size:cover; background-position:center;}
.evcard.hasbg .inner{background:rgba(255,255,255,.8);}
/* shots */
.shotgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
.shot{
  position:relative; border-radius:6px; overflow:hidden; background:var(--line);
  aspect-ratio:3/4; cursor:pointer; border:1px solid var(--line);
}
.shot img{width:100%; height:100%; object-fit:cover; display:block; transition:filter .25s,opacity .25s;}
/* 撮影済み: 暗転ではなく「明るく満たされた」表現（白背景に透かす＋達成スタンプ） */
.shot.done{background:#fff;}
.shot.done img{filter:saturate(.6) brightness(1.05); opacity:.32;}
.shot.p1{border:2px solid var(--sub);}
.shot.p2{border:3px solid var(--tx);}
.shot .ck{
  position:absolute; inset:0; display:none; align-items:center; justify-content:center;
}
.shot .ck span{
  color:var(--tx); border:2px solid var(--tx); background:rgba(255,255,255,.88);
  padding:2px 10px; font-size:14px; font-weight:800; border-radius:99px;
  transform:rotate(-8deg); letter-spacing:.02em;
}
.shot.done .ck{display:flex;}
.shot .num{
  position:absolute; top:5px; left:5px; background:rgba(0,0,0,.6); color:#fff;
  font-size:11px; font-weight:700; padding:1px 7px; border-radius:3px;
}
.shot .cap{
  position:absolute; bottom:0; left:0; right:0; background:linear-gradient(transparent,rgba(0,0,0,.65));
  color:#fff; font-size:10.5px; padding:14px 6px 4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.shot.sel{outline:3px solid var(--tx); outline-offset:-3px;}
.shot.sel::after{
  content:'✓'; position:absolute; top:5px; right:5px; width:22px; height:22px;
  background:var(--tx); color:#fff; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px;
}
.shot .prio{
  position:absolute; top:5px; right:5px; font-size:10px; font-weight:800;
  padding:1px 6px; border-radius:3px; letter-spacing:.03em;
}
.shot .prio.p1{background:rgba(255,255,255,.92); color:var(--tx); border:1px solid var(--tx);}
.shot .prio.p2{background:rgba(0,0,0,.8); color:#fff; border:1px solid #fff;}
.shot .cc{
  position:absolute; bottom:5px; right:5px; background:rgba(0,0,0,.6); color:#fff;
  font-size:9.5px; font-weight:700; padding:1px 6px; border-radius:3px;
}
.shot .cap{padding-right:56px;}
/* 追加申請 */
.pend{
  border:1px dashed var(--sub); border-radius:var(--r); padding:10px; margin-bottom:10px;
  display:flex; gap:10px; background:var(--card); cursor:pointer; align-items:center;
}
.pend img{flex:0 0 56px; width:56px; height:74px; object-fit:cover; border-radius:4px; background:var(--line);}
.pend .pbody{flex:1; min-width:0;}
.pend .who{font-size:12.5px; font-weight:700;}
.pend .when{color:var(--sub); font-size:10.5px; font-weight:400; margin-left:6px;}
.pend .cap2{font-size:12.5px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px;}
.pend .st{font-size:11px; font-weight:700; margin-top:4px;}
/* コメント */
.cmts{max-height:180px; overflow-y:auto;}
.cmt{padding:7px 2px; border-bottom:1px dashed var(--line); font-size:13px; line-height:1.55;}
.cmt .who{font-weight:700; font-size:12px;}
.cmt .when{color:var(--sub); font-size:10.5px; margin-left:6px;}
.opt2{font-size:11px; color:var(--sub); font-weight:400; margin-left:8px;}
.filterrow{display:flex; gap:6px; margin-bottom:12px;}
.filterrow button{
  flex:1; border:1px solid var(--line); background:var(--card); color:var(--sub);
  border-radius:6px; padding:7px 0; font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit;
}
.filterrow button.on{background:var(--tx); border-color:var(--tx); color:#fff;}
/* modal */
.modal{
  position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:100;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.modal .box{
  background:var(--card); border-radius:10px; padding:18px; width:100%; max-width:480px;
  max-height:86vh; overflow-y:auto;
}
.modal .box h3{font-size:15px; margin-bottom:10px;}
.modal img.prev{width:100%; border-radius:6px; margin-bottom:10px;}
.note{font-size:12px; color:var(--sub); margin-top:8px; line-height:1.55;}
details{margin-top:10px; font-size:13px;}
details summary{cursor:pointer; color:var(--sub); font-weight:600; font-size:12.5px;}
.ttrow{display:flex; gap:8px; margin-bottom:8px; align-items:center;}
.ttrow input.t{flex:0 0 92px;}
.hidden{display:none!important;}
.secttl{font-size:13px; font-weight:700; color:var(--sub); margin:18px 0 8px;}
/* 大見出し（進捗タブのセクション区切り） */
.sechd{
  display:flex; align-items:baseline; gap:8px;
  margin:26px 0 10px; padding:0 2px 7px;
  border-bottom:2px solid var(--tx);
}
.sechd:first-child{margin-top:4px;}
.sechd .t{font-size:16px; font-weight:800; letter-spacing:.02em; color:var(--tx); line-height:1.3;}
.sechd .c{
  margin-left:auto; flex:0 0 auto; font-size:11px; font-weight:800; color:var(--sub);
  background:var(--acbg); border-radius:99px; padding:3px 9px; white-space:nowrap;
}
.sechd + .note{margin:-2px 0 10px; padding:0 2px;}
/* document-style form */
.doc{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:22px 18px 18px;}
.doc .bigtitle{
  width:100%; border:none; border-bottom:2px solid var(--tx); border-radius:0;
  font-size:22px; font-weight:800; padding:4px 2px 8px; background:none; color:var(--tx);
}
.doc .bigtitle::placeholder{color:var(--no); font-weight:700;}
.doc .intro{
  border:none; border-radius:0; padding:8px 2px; font-size:14.5px; color:var(--tx);
  background:none; width:100%; margin-top:6px;
}
.sech{font-size:17.5px; font-weight:800; margin:24px 0 6px; display:flex; align-items:center; gap:8px;}
.sech .opt{font-size:11px; color:var(--sub); font-weight:600;}
.sech.soff{color:var(--no);}
.tgl{
  margin-left:auto; font-size:10.5px; font-weight:800; padding:3px 12px; border-radius:99px;

  flex:0 0 auto; letter-spacing:.05em;
}
.tgl.on{background:var(--tx); color:#fff; border-color:var(--tx);}
/* たたんでおく説明（募集シートの【副主催】など） */
details.exp{margin:2px 0 8px; font-size:13px;}
details.exp summary{font-size:12px; color:var(--sub); font-weight:700;}

details.preset summary{font-size:11.5px; color:var(--sub); font-weight:600; cursor:pointer;}

  display:block; width:100%; text-align:left; font-size:12.5px; line-height:1.5;
  padding:8px 12px; border:1px solid var(--line); border-radius:6px; margin:5px 0;
  background:var(--card); color:var(--tx); cursor:pointer; font-family:inherit;

.pchip:active{opacity:.7;}
.pchip.all{text-align:center; font-weight:800; border-style:dashed;}
.doc input[type=text],.doc input[type=datetime-local],.doc input[type=time],.doc textarea{

}

.doc .row{align-items:flex-end;}
.starh{
  font-size:13.5px; font-weight:800; color:var(--tx);
  background:var(--acbg); padding:6px 12px; border-radius:6px;
  border-left:3px solid var(--tx); margin:14px 0 6px;

/* 入力済みの欄は色付きで表示 */
.doc input.filled, .doc textarea.filled{
  border-bottom-color:#2e6fb0; color:#1c4d80;
  background:#f3f8fd; border-radius:6px 6px 0 0;
}
/* 確定メンバー・カメラマン・アシスタントの枠（長い募集シートの中で見分けやすく）／招待画面の役割ごとの枠 */
.grpbox{background:#f4f4f5; border:1px solid #e4e4e7; border-radius:12px; padding:2px 14px 14px; margin:26px -6px 0;}
.grpbox .grplead{font-size:12.5px; color:#555; background:#fff; border:1px solid #ececef; border-radius:8px; padding:8px 10px; margin:12px 0 0; line-height:1.6;}

.doc .grpbox input[type=text]{background:#fff; border-bottom-color:#d4d4d8; border-radius:6px 6px 0 0; padding:7px 6px;}

.copyline{display:flex; align-items:center; gap:8px; background:var(--acbg); border-radius:8px; padding:6px 6px 6px 10px; margin:10px 0 0;}

.invbox{background:#f4f4f5; border:1px solid #e4e4e7; border-radius:12px; padding:12px 12px 8px; margin:12px 0 0;}
.invbox .invh{font-size:13.5px; font-weight:800;}
.invbox .note{margin:2px 0 8px;}
.invrow{display:flex; align-items:center; gap:8px; background:#fff; border:1px solid #ececef; border-radius:8px; padding:6px 8px; margin:6px 0;}
.invrow .nm{flex:1; min-width:0; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.invrow .btn{flex:0 0 auto; margin:0;}
.invrow label.sent{flex:0 0 auto; display:flex; align-items:center; gap:3px; font-size:12px; color:var(--sub); white-space:nowrap; cursor:pointer;}

.dtlcv{width:100%; max-width:400px; border:1px solid var(--line); border-radius:6px; margin:10px auto 4px; display:block;}
/* 併せページ（表示専用） */
.rotitle{font-size:22px; font-weight:800; border-bottom:2px solid var(--tx); padding:4px 2px 8px;}
.rointro{font-size:14.5px; padding:8px 2px 0; line-height:1.7;}
.ro{font-size:14px; line-height:1.75; padding:2px 2px 0;}

/* 併せページの人名タップ → Xのプロフィールを開く */

  background:none; border:none; padding:0; font:inherit; color:inherit;
  text-align:left; cursor:pointer; font-family:inherit;
}

.rop .xlink:active{opacity:.6;}
/* 参加者一覧（主催・副主催のみ表示。役割バッジと操作ボタンつき） */
.rorow{
  display:flex; align-items:center; flex-wrap:wrap; gap:6px 4px;
  padding:7px 0; border-bottom:1px dashed var(--line);
}
.rorow:last-of-type{border-bottom:none;}

  flex:1 1 120px; min-width:0; font-size:14px; font-weight:700;

}

.rorow .claimbtn{flex:0 0 auto;}

<body>
<div id="topStick">
  <div class="savedbar hidden" id="savedBar">
    <span class="open" id="savedBarLabel" onclick="showList()">保存された併せを開く ▾</span>
    <button onclick="newEvent()">＋ 新規</button>
  </div>
  <header>
    <h1 id="hTitle">併せPlanner</h1>
    <button class="hbtn txt" id="meBtn" onclick="showMyPage()">マイページ</button>
    <button class="hbtn txt" id="invBtn" onclick="showInvite()">招待</button>
  </header>
  <div class="appbanner hidden" id="appBanner"></div>
</div>
<main id="view"></main>
<nav class="tabs" id="tabbar"></nav>
<div id="modalHost"></div>
<script>
/* ============ 併せPlanner core ============ */
'use strict';

/* WEB版（jyounetsu.site/awase/）は true。build.sh が書き換える。
   WEB版の役割: (A) 自分で作る併せ＝募集シートだけ（スクショ用・サーバーに上げない）
               (B) 招待リンクから参加した併せ＝アプリと同じ参加者画面（進捗・構図・忘れ物まで） */
const LITE = false;
/* アプリのストアURL（公開されたら入れる）。WEB版で参加した人に「アプリもあります」と控えめに案内する */
const APP_LINKS = { ios: null, android: null };

/* ---- state & persistence ---- */
let state = { events: [] };
let cur = null;
let curTab = 'info';

const store = {
  get(){ try{ return JSON.parse(localStorage.getItem('awasePlanner')); }catch(e){ return null; } },
  set(v){ try{ localStorage.setItem('awasePlanner', JSON.stringify(v)); }catch(e){ /* storage unavailable */ } bkDirty(); }
};

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ---- 役割と表示名 ----
   この端末で作成した併せ = 主催。招待リンクから参加した併せ = 招待者。
   判定は localStorage 側に持ち、同期で上書きされない。 */
const own = {
  get(){ try{ return JSON.parse(localStorage.getItem('awaseOwned'))||{}; }catch(e){ return {}; } },
  set(v){ try{ localStorage.setItem('awaseOwned', JSON.stringify(v)); }catch(e){} },
  mark(id){ const o=own.get(); o[id]=true; own.set(o); }
};
function isOwner(e){ return !!e && !!own.get()[e.id]; }
/* 副主催: 主催が名簿から任命した端末。主催と同じ権限を持つが、主催に対しては
   退出も副主催の解除もできない（roster/{clientId}/sub で同期・端末ごと） */
function isSub(e){ const r = e && e.roster && e.roster[clientId()]; return !!(r && r.sub && !r.ban); }
/* 主催と同じ操作ができるか（主催 or 副主催）。権限判定はこちらを使う */
function canHost(e){ return isOwner(e) || isSub(e); }
/* WEB版で、この端末が作った併せ（＝募集シートだけの「作成モード」） */
function liteHost(e){ return LITE && isOwner(e) && !e.shared; }   // shared＝アプリ・フル版で共有した併せ（WEB版でもフル機能）
/* この端末が枠の本人か（claim=最初の端末、claims=同じ個別リンクで追加接続した端末） */
function isMine(x){ return !!x && (x.claim===clientId() || (x.claims||[]).includes(clientId())); }
/* この端末がすでにメンバー・カメラマンのどれかの枠を持っているか（1端末1枠） */
function holdsSlot(e){ return !!e && (e.members||[]).concat(e.cameras||[]).some(isMine); }
function myName(){ try{ return localStorage.getItem('awaseName')||''; }catch(e){ return ''; } }
function setMyName(n){
  try{ localStorage.setItem('awaseName', n); localStorage.setItem('awaseNameAt', String(Date.now())); }catch(e){}
  bkDirty();
  /* 参加後に名前を入れた／変えた → 名簿（主催の参加者一覧）にも反映 */
  if(typeof conns!=='undefined') state.events.forEach(e=>{ if(conns[e.id]) registerRoster(e); });
}
/* マイページのXの@ID（名前は表示名 myName と共通） */
function myTw(){ try{ return localStorage.getItem('awaseTw')||''; }catch(e){ return ''; } }
function setMyTw(t){
  try{ localStorage.setItem('awaseTw', t); localStorage.setItem('awaseTwAt', String(Date.now())); }catch(e){}
  bkDirty();
}
/* 主催の併せで【主催】欄が空なら、マイページの名前・@IDを入れる（招待で参加した併せ・副主催の併せには触らない） */
function fillHost(e){
  if(!e || !isOwner(e) || e.host || e.hostTw) return false;
  if(!myName() && !myTw()) return false;
  e.host = myName(); e.hostTw = myTw();
  return true;
}
function clientId(){
  try{
    let c = localStorage.getItem('awaseClient');
    if(!c){ c = uid(); localStorage.setItem('awaseClient', c); }
    return c;
  }catch(e){ return 'anon'; }
}
function roomId(){
  const words=['sakura','yuki','hoshi','tsuki','hana','sora','umi','kaze','yume','hikari'];
  /* 部屋ID＝招待リンクの鍵。推測されないよう乱数部は10文字（旧形式の5文字の部屋もそのまま使える） */
  const rnd = Array.from(crypto.getRandomValues(new Uint8Array(10)), b=>'abcdefghijkmnpqrstuvwxyz23456789'[b & 31]).join('');
  return words[Math.floor(Math.random()*words.length)] + '-' + rnd;
}
function ev(){ return state.events.find(e=>e.id===cur); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function blankEvent(){
  return {
    id: uid(), updatedAt: Date.now(),
    title:'', intro:'', content:'',
    host:'', hostTw:'',
    subHosts:[],                     // 副主催（主催と同じ権限。募集シートで先に決めておく枠）
    dateType:'tbd', date:'', dateText:'', endTime:'',
    place:'', studio:'', placeUrl:'', station:'', costume:'',
    feeLayer:'', feeCamera:'',
    hashtag:'',
    condCommon:'', condLayer:'', condCamera:'', notes:'', message:'',
    recruits:[{chara:''}],
    recCam:'', recAs:'',              // カメラマン・アシスタントの募集枠人数
    members:[], cameras:[], assistants:[],
    shots:[], pending:[], comments:{}, roster:{}, timetable:[], dataLinks:[],
    bg:null, bgUrl:null, bgId:null,  // カウントダウン背景（bg=端末内dataURL・bgUrl=R2）
    sec:{},
    sync:{room: roomId()}
  };
}
function hasContent(e){
  return !!(e.title || e.intro || e.date || e.dateText || e.members.length || e.shots.length || e.place || e.studio);
}

function save(pushRemote=true){
  const e = ev();
  if(e) e.updatedAt = Date.now();
  store.set(state);
  updateSavedBar();
  if(pushRemote && e) schedulePush(e);
  askPersist();
}

/* ---- date utils ---- */
function fmtDate(d){
  if(!d) return '未定';
  const dt = new Date(d);
  if(isNaN(dt)) return '未定';
  const w = ['日','月','火','水','木','金','土'][dt.getDay()];
  const hm = ('0'+dt.getHours()).slice(-2)+':'+('0'+dt.getMinutes()).slice(-2);
  return `${dt.getFullYear()}年${dt.getMonth()+1}月${dt.getDate()}日（${w}）${hm}〜`;
}
function isFixed(e){ return e.dateType==='fixed' && !!e.date; }
function dateDisp(e){
  if(isFixed(e)) return fmtDate(e.date) + (e.endTime? e.endTime : '');
  return (e.dateText && e.dateText.trim()) || '日程未定';
}
function cdText(d){
  if(!d) return '';
  const diff = new Date(d) - Date.now();
  if(isNaN(diff)) return '';
  if(diff <= 0){
    return (diff > -86400000) ? '今日が本番！' : '撮影データはこちら';
  }
  const day = Math.floor(diff/86400000);
  const h = Math.floor(diff%86400000/3600000);
  return day>0 ? `あと${day}日！` : `あと${h}時間！`;
}
/* 進捗タブに重ねるカウントダウンバッジ */
function updateCdBadge(){
  const el = document.getElementById('tabCd');
  if(!el) return;
  const e = ev();
  const t = (e && isFixed(e)) ? cdText(e.date) : '';
  el.textContent = t;
  el.classList.toggle('hidden', !t);
}

/* ---- 上部固定バー & 併せ一覧 ---- */
function updateSavedBar(){
  const saved = state.events.filter(hasContent);
  const bar = document.getElementById('savedBar');
  const lbl = document.getElementById('savedBarLabel');
  if(saved.length){
    bar.classList.remove('hidden');
    lbl.textContent = `保存された併せ（${saved.length}件）を開く ▾`;
  }else{
    bar.classList.add('hidden');
  }
}
function showList(){
  const saved = state.events.filter(hasContent);
  document.getElementById('modalHost').innerHTML = `
  <div class="modal" onclick="if(event.target===this)closeModal()" style="align-items:flex-start;padding-top:54px">
    <div class="box">
      <h3>保存された併せ</h3>
      ${saved.length? saved.map(e=>{
        const bg = e.bgUrl || e.bg;
        return `<div class="evcard ${bg?'hasbg':''}" onclick="closeModal();openEvent('${e.id}')" style="${bg?`background-image:url('${bg}');`:''}${e.id===cur?'border-color:var(--tx)':''}">
          <div class="inner">
            <div class="ttl">${esc(e.title)||'（無題の併せ）'}${e.id===cur?'<span style="font-size:11px;color:var(--sub);font-weight:400">　表示中</span>':''}</div>
            <div class="meta">${esc(e.content)||''}${e.content?' ｜ ':''}${esc(dateDisp(e))}</div>
            ${isFixed(e)?`<div class="cdown" data-cd="${e.date}">${cdText(e.date)}</div>`:''}
            <div class="mini">
              <span>メンバー ${e.members.length}名</span>
              <span>構図 ${e.shots.filter(s=>s.done).length}/${e.shots.length}</span>
            </div>
          </div>
        </div>`;
      }).join('') : '<div class="note">まだ保存された併せはありません</div>'}
      <button class="btn wide" onclick="closeModal();newEvent()">＋ 新しい併せを作成</button>
      <button class="btn ghost wide" onclick="closeModal();joinPrompt()">招待コードで参加する</button>
      <details style="text-align:center"><summary>設定・バックアップ</summary>
        <div style="padding:10px">
          <div style="margin-bottom:8px;font-size:12px;color:var(--sub)">マイページ：${esc(myName())||'名前未設定'}${myTw()?`（${esc(at(myTw()))}）`:''}
            <button class="btn ghost sm" onclick="closeModal();showMyPage()" style="margin-left:6px">変更</button></div>
          ${bkAvailable()? `<div style="margin-bottom:10px;font-size:12px;color:var(--sub)">自動バックアップ：${esc(bkLastText())}（復元コードはマイページから）</div>
          <button class="btn ghost sm" onclick="closeModal();showBkCode(false)">復元コード・PC・タブレットでも使う</button>
          <button class="btn ghost sm" onclick="closeModal();bkRestorePrompt()" style="margin-left:6px">コードで引き継ぐ</button>
          <div style="margin:12px 0 6px;font-size:12px;color:var(--sub)">ファイルでのバックアップ</div>`:''}
          ${canA2hs()? `<div style="margin-bottom:10px"><button class="btn ghost sm" onclick="closeModal();showA2hs()">ホーム画面に追加するには（データが消えにくくなります）</button></div>` : ''}
          <button class="btn ghost sm" onclick="exportJSON()">データをファイルに保存</button>
          <button class="btn ghost sm" onclick="importJSON()" style="margin-left:6px">ファイルから復元</button>
          <div style="margin-top:10px;font-size:12px"><a href="${WEB_BASE}privacy.html" target="_blank" rel="noopener" style="color:var(--sub)">プライバシーポリシー</a></div>
        </div></details>
      <button class="btn sec wide" onclick="closeModal()">閉じる</button>
    </div>
  </div>`;
}

/* ---- router ---- */
function openEvent(id, tab='info'){
  cur = id; curTab = tab;
  renderTabs();
  renderTab();
  updateSavedBar();
  window.scrollTo(0,0);
  connectEvent(ev());
  if(typeof conns!=='undefined' && conns[id]) pollAll();   // 開いていない間は1分に1回しか見ていないので、開いたらすぐ取り直す
}
function openStart(){
  if(!state.events.length){
    const e = blankEvent();
    own.mark(e.id);
    fillHost(e);
    state.events.push(e);
    store.set(state);
  }
  openEvent(pickStartEvent().id, 'info');
}
function pickStartEvent(){
  const now = Date.now();
  const future = state.events
    .filter(e=>isFixed(e) && new Date(e.date) > now - 86400000)
    .sort((a,b)=>new Date(a.date)-new Date(b.date));
  if(future.length) return future[0];
  return [...state.events].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))[0];
}
function switchTab(t){
  curTab = t;
  renderTabs();
  renderTab();
  window.scrollTo(0,0);
}
/* ---- 「アプリもあります」帯（WEB版で招待から参加した併せのときだけ・閉じたら2週間出さない） ---- */
function appLink(){
  const ua = navigator.userAgent || '';
  if(/iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return APP_LINKS.ios;
  if(/Android/.test(ua)) return APP_LINKS.android;
  return APP_LINKS.ios || APP_LINKS.android;
}
function updateAppBanner(){
  const el = document.getElementById('appBanner');
  const e = ev();
  const url = appLink();
  let off = 0;
  try{ off = +localStorage.getItem('awaseAppBannerOff') || 0; }catch(err){}
  const show = LITE && !!e && !liteHost(e) && !!url && (Date.now() - off > 14*86400000);
  el.classList.toggle('hidden', !show);
  if(show) el.innerHTML = `<span>📱 アプリ版もあります。よく使うならアプリのほうが快適です</span>
    <a href="${esc(url)}" target="_blank" rel="noopener">アプリを見る</a>
    <button aria-label="閉じる" onclick="closeAppBanner()">×</button>`;
}
function closeAppBanner(){
  try{ localStorage.setItem('awaseAppBannerOff', String(Date.now())); }catch(err){}
  updateAppBanner();
}
function renderTabs(){
  const bar = document.getElementById('tabbar');
  const lh = liteHost(ev());
  document.getElementById('invBtn').classList.toggle('hidden', lh); // WEB版の作成モードは招待しない
  updateAppBanner();
  if(lh){
    bar.classList.add('hidden');
    document.body.style.paddingBottom = '30px';
    return;
  }
  bar.classList.remove('hidden');
  document.body.style.paddingBottom = '';
  /* 招待者に要項タブはない。'info'のままなら併せタブへ寄せる */
  if(curTab==='info' && !canHost(ev())) curTab='awase';
  const tabs = canHost(ev())
    ? [['info','募集シート'],['awase','併せ'],['prog','進捗'],['shots','構図'],['items','忘れ物']]
    : [['awase','併せ'],['prog','進捗'],['shots','構図'],['items','忘れ物']];
  bar.innerHTML = tabs.map(([k,l])=>
    `<button class="${curTab===k?'on':''}" onclick="switchTab('${k}')">${l}${k==='prog'?'<span id="tabCd" class="tabcd hidden"></span>':''}</button>`).join('');
  updateCdBadge();
}
function renderTab(){
  const e = ev();
  if(!e){ openStart(); return; }
  document.getElementById('hTitle').textContent = e.title || '新しい併せ募集';
  updateCdBadge();
  if(!canHost(e) && curTab==='info') curTab='awase';
  if(liteHost(e)){ renderInfo(); refreshFilled(); return; }
  if(curTab==='info') renderInfo();
  else if(curTab==='awase') renderAwase();
  else if(curTab==='prog') renderProg();
  else if(curTab==='shots') renderShots();
  else if(curTab==='items') renderMyList();
  refreshFilled();
}

/* ---- 併せページ（招待者向け・確定情報の表示専用） ----
   募集条件・募集キャラなど募集フェーズの項目は載せない。項目ON/OFF(sec)に従う */
function renderAwase(){
  const e = ev();
  const v = document.getElementById('view');
  const owner = canHost(e);
  const S = k => secOn(e,k);
  const line = s => esc(s).replace(/\n/g,'<br>');
  const sect = (label, html) => `<div class="sech">${label}</div><div class="ro">${html}</div>`;
  /* @IDがある人は名前ごとタップでXのプロフィールへ */
  const person = p => {
    const h = xHandle(p.tw);
    const nm = `${p.chara?esc(p.chara)+'：':''}${esc(p.name)||'（名前未定）'}`;
    return `<div class="rop">${h

    out += sect('【参加費】',

  }

  if(S('members') && e.members.length) out += sect('【確定メンバー】', e.members.map(person).join(''));

    <button class="btn sec sm" onclick="addTT()">＋ 行を追加</button>`;
  }else if(tt.length){
    out += sect('【当日タイムテーブル】',

      out += ros.map(([cid,r])=>{

        </div>`;
      }).join('')
      + `<div class="note" style="margin-top:6px">副主催にすると、募集シートの編集・構図の管理・招待リンク・参加者の退出まで主催と同じ操作ができるようになります（主催に退出してもらうことと、主催の権限を変えることだけはできません）。</div>`
      + `<div class="note" style="margin-top:4px">退出させると相手の端末からこの併せが消え、同じリンクでは再参加できなくなります。進捗の枠と個別リンクも作り直されます。</div>`;
    }
  }

  v.innerHTML = `
  <div class="doc">
    <div class="rotitle">${esc(e.title)||'（併せ名未定）'}</div>
    ${e.intro?`<div class="rointro">${line(e.intro)}</div>`:''}

      : isSub(e)
      ? `<div class="note" style="margin-top:18px">あなたは<b>副主催</b>です。主催と同じ操作ができます（主催に退出してもらうことはできません）。</div>`
      : `<div class="note" style="margin-top:18px">このページは表示専用です（編集は主催のみ）。</div>`}
  </div>

}

/* ---- 入力済みの可視化 ---- */
function markFilled(el){
  el.classList.toggle('filled', !!(el.value && el.value.trim()));
}
function refreshFilled(){
  document.querySelectorAll('.doc input, .doc textarea').forEach(el=>{
    if(el.type==='number') return;
    markFilled(el);
  });
}
document.addEventListener('input', ev0=>{
  const t = ev0.target;
  if(t && (t.tagName==='TEXTAREA' || (t.tagName==='INPUT' && t.type!=='number')) && t.closest('.doc')) markFilled(t);
});

function newEvent(){
  const e = blankEvent();
  own.mark(e.id);
  fillHost(e);
  state.events.push(e);
  save(false);
  openEvent(e.id,'info');
}
function deleteEvent(){
  const msg = isOwner(ev())
    ? 'この併せを削除しますか？（元に戻せません）'
    : 'この併せをこの端末から削除しますか？（招待リンクからまた参加できます）';
  if(!confirm(msg)) return;
  disconnectEvent(cur);
  vMarkDeleted(cur);
  state.events = state.events.filter(x=>x.id!==cur);
  store.set(state);
  cur = null;
  openStart();
}

function hasLine(v,t){ return String(v||'').split('\n').map(s=>s.trim()).includes(t); }
const openPresets = new Set();
function presetHTML(e,k){
  const p = PRESETS[k];
  if(!p) return '';
  const allIn = p.mode==='line' && p.items.every(t=>hasLine(e[k],t));
  return `<details class="preset" ${openPresets.has(k)?'open':''} ontoggle="this.open?openPresets.add('${k}'):openPresets.delete('${k}')"><summary>よく使われる文言から選ぶ</summary><div>
  ${p.mode==='line'?`<button class="pchip all ${allIn?'on':''}" onclick="applyPresetAll('${k}')">${allIn?'✓ すべて解除':'すべて選択'}</button>`:''}
  ${p.items.map((t,i)=>{
    const act = p.mode==='line' ? hasLine(e[k],t) : e[k]===t;
    return `<button class="pchip ${act?'on':''}" onclick="applyPreset('${k}',${i})">${act?'✓ ':''}${esc(t)}</button>`;
  }).join('')}</div></details>`;
}
function applyPresetAll(k){
  const e = ev();
  const p = PRESETS[k];
  const allIn = p.items.every(t=>hasLine(e[k],t));
  let ls = String(e[k]||'').split('\n').filter(s=>s.trim());
  if(allIn){
    ls = ls.filter(s=>!p.items.includes(s.trim()));
  }else{
    p.items.forEach(t=>{ if(!ls.map(s=>s.trim()).includes(t)) ls.push(t); });
  }
  e[k] = ls.join('\n');
  save();
  renderTab();
}
function applyPreset(k,i){
  const e = ev();
  const p = PRESETS[k];
  const t = p.items[i];
  if(p.mode==='set'){
    e[k] = (e[k]===t) ? '' : t;
  }else{
    let ls = String(e[k]||'').split('\n').filter(s=>s.trim());
    if(ls.map(s=>s.trim()).includes(t)) ls = ls.filter(s=>s.trim()!==t);
    else ls.push(t);
    e[k] = ls.join('\n');
  }
  save();
  renderTab();
}

/* ---- 項目のON/OFF ---- */
function secOn(e,k){ return !e.sec || e.sec[k]!==false; }
function toggleSec(k){
  const e = ev();
  if(!e.sec) e.sec = {};
  e.sec[k] = !secOn(e,k);
  save();
  renderTab();
}
function sechHTML(e,k,label,opt=''){
  const on = secOn(e,k);
  return `<div class="sech ${on?'':'soff'}">${label}${opt?`<span class="opt">${opt}</span>`:''}<button class="tgl ${on?'on':''}" onclick="toggleSec('${k}')">${on?'ON':'OFF'}</button></div>`;
}

/* ---- @IDの自動抽出 ----
   XのプロフィールURLや「名前 @id」形式のテキストを貼るだけで@ID（と名前）を自動入力 */
const TW_RESERVED = ['home','search','explore','i','intent','share','hashtag','messages','notifications','settings','login','signup'];
function extractTw(raw){
  raw = String(raw||'');
  let m = raw.match(/screen_name=([A-Za-z0-9_]{1,15})/);
  if(m) return '@'+m[1];
  m = raw.match(/(?:x|twitter)\.com\/(?:#!\/)?@?([A-Za-z0-9_]{1,15})/i);
  if(m && !TW_RESERVED.includes(m[1].toLowerCase())) return '@'+m[1];
  m = raw.match(/@([A-Za-z0-9_]{1,15})/);
  if(m) return '@'+m[1];
  return null;
}
function extractPasteName(raw){
  let s = String(raw||'');
  const cuts = [s.indexOf('@'), s.search(/https?:\/\//), s.search(/(?:x|twitter)\.com/i)].filter(i=>i>=0);
  if(cuts.length) s = s.slice(0, Math.min(...cuts));
  s = s.replace(/[\n\r,、/｜|]+/g,' ').trim();
  return (s && s.length<=20) ? s : null;
}
function twInput(el, kind, i){
  const raw = el.value;
  const tw = extractTw(raw);
  if(kind==='members' || kind==='cameras' || kind==='assistants') pAt(kind, i);
  const arr = ev()[kind];
  if(!arr || !arr[i]) return;
  if(tw && tw !== raw.trim()){
    el.value = tw;
    const nm = extractPasteName(raw);
    if(nm && !arr[i].name){
      arr[i].name = nm;
      const row = el.closest('.row');
      const nameInp = row && row.querySelector('input[placeholder="名前"], input[placeholder="お名前"]');
      if(nameInp){ nameInp.value = nm; markFilled(nameInp); }
      toast('名前と@IDを自動入力しました');
    }else{
      toast('@IDを自動入力しました');
    }
  }
  arr[i].tw = el.value;
  save();
}

/* Xの文字数換算（半角=1、全角=2、URL=一律23） */
function xWeight(s){
  let n = 0;
  String(s).split(/(https?:\/\/\S+)/).forEach(p=>{
    if(/^https?:\/\//.test(p)){ n += 23; return; }
    for(const ch of p) n += ch.codePointAt(0) <= 0x7F ? 1 : 2;
  });
  return n;
}
function updateXCount(){
  const ta = document.getElementById('twText');
  const el = document.getElementById('xCount');
  if(!ta || !el) return;
  const n = xWeight(ta.value);

    + (n>280 ? ' <b style="color:#e05252">オーバーしています</b>' : '');
}
function at(t){ t=String(t||'').trim(); return t? (t.startsWith('@')?t:'@'+t) : ''; }

/* ファイル名に使えない文字・絵文字を除去 */
function safeName(s){
  s = String(s||'')
    .replace(/[\\\/:*?"<>|#%&{}$!'@+`=~^;,\n\r\t]/g,'')
    .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE00}-\u{FE0F}\u{200D}]/gu,'')
    .replace(/\s+/g,'_')
    .slice(0,30);
  return s || 'awase';
}
function dataURLtoBlob(du){
  const bin = atob(du.split(',')[1]);
  const buf = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
  return new Blob([buf],{type:'image/png'});
}
async function downloadDetails(){
  const imgs = [...document.querySelectorAll('#dtlHost img.dtlcv')];
  if(!imgs.length){ toast('スクショがありません'); return; }
  const base = safeName(ev().title);
  const files = imgs.map((img,i)=>{
    const name = base + (imgs.length>1? `_bosyu${i+1}.png` : '_bosyu.png');
    return new File([dataURLtoBlob(img.src)], name, {type:'image/png'});
  });
  // スマホ（iOS/Android・Chrome/Safari）：共有シート経由で写真アプリにまとめて保存
  try{
    if(navigator.canShare && navigator.canShare({files})){
      await navigator.share({files});
      return;
    }
  }catch(err){
    if(err && err.name==='AbortError') return; // ユーザーがキャンセル
    /* 共有に失敗した場合はダウンロードにフォールバック */
  }
  try{
    files.forEach((f,i)=>setTimeout(()=>{
      const url = URL.createObjectURL(f);
      const a = document.createElement('a');
      a.download = f.name;
      a.href = url;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 10000);
    }, i*400));
    toast(files.length>1? files.length+'枚を保存しました' : '保存しました');
  }catch(err){
    toast('保存できませんでした');
  }
}

/* ---- canvas helpers ---- */
function wrapText(ctx, text, maxW){
  const out=[]; let line='';
  for(const ch of String(text)){
    if(ch==='\n'){ out.push(line); line=''; continue; }
    if(ctx.measureText(line+ch).width > maxW){ out.push(line); line=ch; }
    else line += ch;
  }
  out.push(line);
  return out;
}
const FNT = '"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif';

/* ---- 募集内容 → テキスト画像 ---- */
/* 行の種類（スクショの階層ルール）:
   h1 = タイトル(50px) / h = 大項目見出し【…】(40px) / kv = ラベル【…】+値の1行(ラベル36px太字+値35px)
   star = 中項目(36px) / b = 本文(35px) / sp = 空行 */
function detailBlocks(e){
  const B=[];
  const S = k => secOn(e,k);
  const lines = s => String(s||'').split('\n').map(x=>x.trim()).filter(Boolean);
  const kv = (label,value) => B.push({t:'kv', label, text:String(value||'')});
  if(e.title) B.push({t:'h1', text:e.title});
  if(e.intro){ B.push({t:'sp'}); lines(e.intro).forEach(l=>B.push({t:'b', text:l})); }
  B.push({t:'sp'});
  if(e.host) kv('【主催】', `${e.host}${e.hostTw?`（${at(e.hostTw)}）`:''}`);
  /* 副主催は1人ならkv1行、2人以上は見出し＋箇条書きで折り返しを避ける */
  const subs = (e.subHosts||[]).filter(h=>h.name||h.tw)
    .map(h=>`${h.name||''}${h.tw?`（${at(h.tw)}）`:''}`);
  if(subs.length===1) kv('【副主催】', subs[0]);
  else if(subs.length>1){
    B.push({t:'h', text:'【副主催】'});
    subs.forEach(x=>B.push({t:'b', text:'・'+x}));
  }
  if(e.content) kv('【作品】', e.content);
  kv('【日程】', dateDisp(e));
  if(S('place')){
    if(e.place||e.studio) kv('【場所】', `${e.place||''}${e.studio?`（${e.studio}）`:''}`);
    if(e.placeUrl) kv('【URL】', e.placeUrl);
    if(e.station) kv('【最寄駅】', e.station);
  }
  if(e.costume) kv('【衣装】', e.costume);
  if(S('fee') && (e.feeLayer||e.feeCamera)){
    if(e.feeLayer && !e.feeCamera){
      kv('【参加費】', e.feeLayer);
    }else if(e.feeCamera && !e.feeLayer){
      kv('【参加費】', `カメラマン・アシスタント：${e.feeCamera}`);
    }else{
      B.push({t:'h', text:'【参加費】'});
      B.push({t:'b', text:`・レイヤー：${e.feeLayer}`});
      B.push({t:'b', text:`・カメラマン・アシスタント：${e.feeCamera}`});
    }
  }
  const recs = e.recruits.filter(r=>r.chara);
  const rc = parseInt(e.recCam,10)||0, ra = parseInt(e.recAs,10)||0;
  if(recs.length || rc || ra){
    B.push({t:'sp'}, {t:'h', text:'【募集メンバー】'});
    recs.forEach(r=>B.push({t:'b', text:`・${r.chara}`}));
    if(rc) B.push({t:'b', text:`・カメラマン（${rc}名）`});
    if(ra) B.push({t:'b', text:`・アシスタント（${ra}名）`});
  }
  const conds = [['☆参加者共通',e.condCommon],['☆レイヤー',e.condLayer],['☆カメラマン・アシスタント',e.condCamera]].filter(c=>c[1]&&c[1].trim());
  if(conds.length){
    B.push({t:'sp'});
    B.push({t:'b', text:'※募集する身ではありますがトラブル防止の為、参加条件をもうけさせていただきます'});
    B.push({t:'sp'}, {t:'h', text:'【募集条件】'});
    conds.forEach(([h,body])=>{
      B.push({t:'star', text:h});
      lines(body).forEach(l=>B.push({t:'b', text:'・'+l.replace(/^[・･•]/,'')}));
      B.push({t:'sp'});
    });
  }
  if(S('notes') && e.notes && e.notes.trim()){
    B.push({t:'h', text:'【その他注意事項】'});
    lines(e.notes).forEach(l=>B.push({t:'b', text:'・'+l.replace(/^[・･•]/,'')}));
    B.push({t:'sp'});
  }
  const mems = S('members')? e.members.filter(m=>m.chara||m.name) : [];
  if(mems.length){
    B.push({t:'h', text:'【確定メンバー】'});
    mems.forEach(m=>B.push({t:'b', text:`・${m.chara||'？'}／${m.name||''}${m.tw?`（${at(m.tw)}）`:''}`}));
  }
  const cams = S('cameras')? e.cameras.filter(c=>c.name||c.tw) : [];
  if(cams.length){
    B.push({t:'h', text:'【カメラマン】'});
    cams.forEach(c=>B.push({t:'b', text:`・${c.name||''}${c.tw?`（${at(c.tw)}）`:''}`}));
  }
  const asts = S('assistants')? (e.assistants||[]).filter(a=>a.name||a.tw) : [];
  if(asts.length){
    B.push({t:'h', text:'【アシスタント】'});
    asts.forEach(a=>B.push({t:'b', text:`・${a.name||''}${a.tw?`（${at(a.tw)}）`:''}`}));
  }
  // 意気込み・ごあいさつ（見出しなしで自然に流す・長文可・段落の空行も残す）
  if(e.message && e.message.trim()){
    B.push({t:'sp'});
    String(e.message).split('\n').forEach(l=>{
      l = l.trim();
      if(l) B.push({t:'b', text:l});
      else B.push({t:'sp'});
    });
  }
  // 締め（ポスト文と表記を統一）
  B.push({t:'sp'}, {t:'b', text:'ご応募・ご質問はDMまでお願いします。'});
  if(S('hashtag') && e.hashtag) B.push({t:'b', text:e.hashtag});
  return B;
}

/* 行を指定数のページに等分割（見出しがページ末尾に残らないよう調整） */
function paginateRows(rows, parts){
  if(parts<=1) return [rows];
  const total = rows.reduce((a,r)=>a+r.lh,0);
  const target = total/parts;
  const pages=[]; let cur=[]; let acc=0;
  rows.forEach(r=>{
    if(pages.length < parts-1 && cur.length && acc + r.lh/2 > target){
      pages.push(cur); cur=[]; acc=0;
    }
    cur.push(r); acc += r.lh;
  });
  if(cur.length) pages.push(cur);
  // ページ末尾の見出し・空行は次ページ先頭へ送る
  for(let i=0;i<pages.length-1;i++){
    while(pages[i].length && ['h1','h','star','sp'].includes(pages[i][pages[i].length-1].t)){
      pages[i+1].unshift(pages[i].pop());
    }
  }
  // ページ先頭の空行は削除
  pages.forEach(p=>{ while(p.length && p[0].t==='sp') p.shift(); });
  return pages.filter(p=>p.length);
}

function renderDetailCanvases(e){
  const host = document.getElementById('dtlHost');
  host.innerHTML='';
  const W=1080, M=84;
  const meas = document.createElement('canvas').getContext('2d');

  // 行リスト化（折り返し込み）
  const rows=[];
  const SZ = {h1:[50,84,800], h:[40,76,800], kv:[36,66,700], star:[36,70,700], b:[35,62,500], sp:[0,32,400]};
  detailBlocks(e).forEach(bk=>{
    const [size,lh,wt] = SZ[bk.t];
    if(bk.t==='sp'){ rows.push({t:'sp', lh}); return; }
    if(bk.t==='kv'){
      // ラベル（太字）＋値。1行目は値をラベルの右に、折り返しは左端から本文サイズで
      meas.font = `700 36px ${FNT}`;
      const lx = meas.measureText(bk.label).width + 10;
      meas.font = `500 35px ${FNT}`;
      const firstW = W-M*2-lx, restW = W-M*2;
      const ls=[]; let line=''; let max=firstW;
      for(const ch of String(bk.text)){
        if(ch==='\n'){ ls.push(line); line=''; max=restW; continue; }
        if(meas.measureText(line+ch).width > max){ ls.push(line); line=ch; max=restW; }
        else line += ch;
      }
      ls.push(line);
      ls.forEach((l,i)=>{
        if(i===0) rows.push({t:'kv', label:bk.label, text:l, size, lh, wt, lx, cont:false});
        else if(l) rows.push({t:'b', text:l, size:35, lh:62, wt:500, cont:true});
      });
      return;
    }
    meas.font = `${wt} ${size}px ${FNT}`;
    wrapText(meas, bk.text, W-M*2).forEach((l,i)=>{
      rows.push({t:bk.t, text:l, size, lh, wt, cont:i>0});
    });
  });

  if(!rows.length){
    host.innerHTML = '<div class="note">要項に入力するとスクショが生成されます</div>';
    return;
  }

  const pages = paginateRows(rows, splitParts);
  // 全ページ同じ高さに揃える（Xで並べたときにきれい）
  const maxContent = Math.max(...pages.map(p=>p.reduce((a,r)=>a+r.lh,0)));
  const H = Math.max(900, maxContent + M + 40 + M + (pages.length>1?50:0));

  pages.forEach((prows,pi)=>{
    const cv = document.createElement('canvas');
    cv.width=W; cv.height=H;
    const ctx = cv.getContext('2d');
    ctx.fillStyle='#ffffff';
    ctx.fillRect(0,0,W,H);
    ctx.strokeStyle=LINEC; ctx.lineWidth=2;
    ctx.strokeRect(28,28,W-56,H-56);
    let y = M+40;
    prows.forEach(r=>{
      if(r.t==='sp'){ y+=r.lh; return; }
      if(r.t==='kv'){
        ctx.font = `700 36px ${FNT}`;
        ctx.fillStyle = INK;
        ctx.fillText(r.label, M, y + 36*0.55);
        ctx.font = `500 35px ${FNT}`;
        ctx.fillStyle = '#3a3a3a';
        ctx.fillText(r.text, M + r.lx, y + 36*0.55);
        y += r.lh;
        return;
      }
      ctx.font = `${r.wt} ${r.size}px ${FNT}`;
      ctx.fillStyle = (r.t==='h1'||r.t==='h') ? INK : (r.t==='star'? SUBINK : '#3a3a3a');
      ctx.fillText(r.text, M, y + r.size*0.55);
      if(r.t==='h1' && !r.cont){
        ctx.strokeStyle=INK; ctx.lineWidth=2.5;
        ctx.beginPath(); ctx.moveTo(M, y+r.size*0.95); ctx.lineTo(M+ctx.measureText(r.text).width, y+r.size*0.95); ctx.stroke();
      }
      y += r.lh;
    });
    if(pages.length>1){
      ctx.fillStyle='#b5b5b5';
      ctx.font = `600 26px ${FNT}`;
      ctx.textAlign='center';
      ctx.fillText(`${pi+1} / ${pages.length}`, W/2, H-40);
      ctx.textAlign='left';
    }
    // 長押し保存（スマホ）が効くよう img 要素として表示
    const img = document.createElement('img');
    img.src = cv.toDataURL('image/png');
    img.className = 'dtlcv';
    img.alt = '募集内容'+(pages.length>1?` ${pi+1}/${pages.length}`:'');
    host.appendChild(img);
  });
}

/* toast */
let toastTimer=null;
function toast(msg){
  let el = document.getElementById('toastEl');
  if(!el){
    el = document.createElement('div');
    el.id='toastEl';
    el.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(30,30,30,.92);color:#fff;padding:10px 22px;border-radius:6px;font-size:13.5px;font-weight:700;z-index:200;transition:opacity .3s;max-width:86%;text-align:center;pointer-events:none';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity='1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.style.opacity='0'; }, 2200);
}

  if(rankingTried) return;

  try{
    const c = JSON.parse(localStorage.getItem('awaseRankCache'));

/* ---- 禁止語（未成年も使うため：成人向け・酒・たばこ・医薬品など）----

let ngData = null, ngP = null;
function ngNorm(s){
  return String(s||'').normalize('NFKC').toLowerCase()
    .replace(/[\u30a1-\u30f6]/g, c=>String.fromCharCode(c.charCodeAt(0)-0x60))
    .replace(/[\s\u3000・\-ー_]+/g, '');
}
function ngLoad(){

      .then(r=>{ if(!r.ok) throw new Error('ng '+r.status); return r.json(); })
      .then(d=>{
        const n = a=>(a||[]).map(ngNorm).filter(Boolean);
        if(!d || !d.words || !d.words.length) throw new Error('ng empty');
        ngData = {words:n(d.words), exact:n(d.exact), allow:n(d.allow)};
        if(curTab==='items') renderTab();
        return ngData;
      })
      .catch(err=>{ ngP = null; throw err; });
  }
  return ngP;
}
/* 禁止語を含むか。一覧が無いときは「含む」とみなす */
function ngHit(text){
  if(!ngData) return true;
  let k = ngNorm(text);
  if(ngData.exact.includes(k)) return true;
  ngData.allow.forEach(a=>{ k = k.split(a).join(''); });
  return ngData.words.some(w=>k.includes(w));
}

let sqRank = null, sqRankTried = false;

  sqRankTried = true;
  fetch(SYNC_API + '?sr=1', {cache:'no-store'})
    .then(r=>r.ok? r.json() : null)
    .then(d=>{ if(d && Array.isArray(d.items)){ sqRank = d.items; if(curTab==='items') renderTab(); } })

async function sqSearch(term, record){
  if(term==null){ const el = document.getElementById('sqInput'); term = el ? el.value : ''; }
  term = String(term||'').trim().replace(/\s+/g,' ').slice(0,30);
  if(!term) return;
  try{ await ngLoad(); }catch(err){ sqQuery = ''; sqBlocked = '通信できないため、いまは検索できません。電波の良い場所でもう一度お試しください。'; renderTab(); return; }
  if(ngHit(term)){
    sqQuery = '';
    sqBlocked = 'この言葉では検索できません（未成年の方も使うため、お酒・たばこ・医薬品・成人向けの商品は扱っていません）。';

  }
  sqBlocked = '';
  sqQuery = term;
  if(record !== false && syncReady()) apiPost({op:'sq', term}).catch(()=>{});
  renderTab();
}

function addNameToList(name){

}

/* ---- じぶんの忘れ物チェック（専用タブ） ----
   完全に個人のメモ。localStorageのみ（同期に載せない・他の人には見えない・費用ゼロ） */
let myEdit = false;
const MY_PRESETS = ['衣装一式','ウィッグ','カラコン','靴','小物・武器','メイク道具','安全ピン','両面テープ','充電器・モバイルバッテリー','カメラ','現金','身分証'];
/* 初めて開いたときの持ち物（チェックモードの使い方がひと目で分かるように）。
   一度でも保存されたら入れ直さない＝編集モードで消した・空にした状態はそのまま残る */
const MY_DEFAULTS = ['衣装一式','ウィッグ','カラコン','靴','小物・武器','メイク道具','安全ピン','充電器・モバイルバッテリー'];
function myItems(){
  try{
    const raw = localStorage.getItem('awaseMyItems');
    if(raw == null){
      const seed = MY_DEFAULTS.map(t=>({id:uid(), text:t, done:false}));
      localStorage.setItem('awaseMyItems', JSON.stringify(seed));   // 変更時刻は付けない（ほかの端末のリストを優先させる）
      return seed;
    }
    return JSON.parse(raw)||[];
  }catch(e){ return []; }
}
function setMyItems(v){ try{ localStorage.setItem('awaseMyItems', JSON.stringify(v)); localStorage.setItem('awaseMyItemsAt', String(Date.now())); }catch(e){} bkDirty(); }

      }).join('')}

function addAllPresets(){
  const items = myItems();
  MY_PRESETS.forEach(t=>{ if(!items.some(x=>x.text===t)) items.push({id:uid(), text:t, done:false}); });
  setMyItems(items); renderTab();
}
function removeAllPresets(){
  setMyItems(myItems().filter(x=>!MY_PRESETS.includes(x.text)));
  renderTab();
}
function clearMyItems(){
  if(!confirm('登録した持ち物をすべて削除しますか？')) return;
  setMyItems([]);
  myEdit = false;
  renderTab();
}
function addMyItem(){
  const el = document.getElementById('myItemInput');
  const t = (el && el.value || '').trim().slice(0,30);
  if(!t) return;
  const items = myItems();
  if(items.length>=100){ toast('登録は100個までです'); return; }
  items.push({id:uid(), text:t, done:false});
  setMyItems(items); renderTab();
  setTimeout(()=>{ const el2=document.getElementById('myItemInput'); if(el2) el2.focus(); }, 50);
}
function addMyPreset(t){
  const items = myItems();
  const i = items.findIndex(x=>x.text===t);
  if(i>=0) items.splice(i,1);
  else items.push({id:uid(), text:t, done:false});
  setMyItems(items); renderTab();
}
function toggleMyItem(i){
  const items = myItems();
  if(!items[i]) return;
  items[i].done = !items[i].done;
  setMyItems(items); renderTab();
}
function delMyItem(i){
  const items = myItems();
  items.splice(i,1);
  setMyItems(items);
  if(!items.length) myEdit = false;
  renderTab();
}
function resetMyItems(){
  const items = myItems();
  items.forEach(x=>x.done=false);
  setMyItems(items); renderTab();
}
/* ---- カウントダウン背景画像（主催のみ設定・全形式→1000px JPEGに圧縮） ---- */
async function setBgImage(files){
  const f = files && files[0];
  if(!f) return;
  const e = ev();
  try{
    toast('画像を読み込み中…');
    const full = await compressImage(f, 1000, .72);
    if(needsImageCheck(e) && await nsfwBlocked(full)){ toast(NSFW_MSG); return; }
    if(syncReady() && imgApiReady()){
      const id = 'bg' + uid();
      const thumb = await compressImage(f, 300, .6);
      const up = await uploadShotImage(e.sync.room, id, full, thumb);
      if(e.bgId) deleteShotImage(e.sync.room, e.bgId);
      e.bgId = id; e.bgUrl = up.url; e.bg = null;
    }else{
      e.bg = full; // 端末内保存。同期には載せない（cleanMetaで除外）
    }
    e.updatedAt = Date.now();
    save(); renderTab();
    toast('背景を設定しました');
  }catch(err){ console.warn(err); toast('画像の読み込みに失敗しました'); }
}
function delBgImage(){
  const e = ev();
  if(e.bgId) deleteShotImage(e.sync.room, e.bgId);
  e.bg = null; e.bgUrl = null; e.bgId = null;
  e.updatedAt = Date.now();
  save(); renderTab();
  toast('背景を削除しました');
}

function claimMem(i){
  const e = ev();
  if(!canHost(e) || holdsSlot(e)) return;   // 手動で枠を取れるのは主催・副主催の1枠だけ（参加者は個別リンクで）
  e.members[i].claim = clientId();
  save(); renderTab();
  toast('自分の枠に設定しました');
}
function unclaimMem(i){
  const m = ev().members[i];
  const mine = isMine(m);
  if(!confirm(mine? 'この枠の「自分の枠」設定を解除しますか？（あとで再設定できます）'
                  : 'この枠の本人設定を解除しますか？（本人が再度「自分の枠にする」を押せます）')) return;
  delete ev().members[i].claim;
  delete ev().members[i].claims;
  save(); renderTab();
}

function shotComments(e,sid){
  if(!e.comments) e.comments = {};
  if(!e.comments[sid]) e.comments[sid] = [];
  return e.comments[sid];
}
function gridSrc(s){ return s.turl || s.timg || s.url || s.img || ''; }
function fullSrc(s){ return s.url || s.img || s.turl || s.timg || ''; }
function shortTime(t){
  const d = new Date(t);
  if(isNaN(d)) return '';
  return `${d.getMonth()+1}/${d.getDate()} ${('0'+d.getHours()).slice(-2)}:${('0'+d.getMinutes()).slice(-2)}`;
}

function needsImageCheck(e){ return syncReady() && imgApiReady() && !liteHost(e); }

/* 画像の彩度の平均（各画素の max(R,G,B)-min(R,G,B)）。白黒写真はほぼ 0 */
function imageSaturation(img){
  const c = document.createElement('canvas'); c.width = c.height = 48;
  const g = c.getContext('2d'); g.drawImage(img, 0, 0, 48, 48);
  const d = g.getImageData(0, 0, 48, 48).data;
  let sum = 0;
  for(let i=0;i<d.length;i+=4) sum += Math.max(d[i],d[i+1],d[i+2]) - Math.min(d[i],d[i+1],d[i+2]);
  return sum / (d.length/4);

async function addShotArr(arr, owner){
  const e = ev();
  const check = needsImageCheck(e);
  toast(check ? '画像を確認中…' : '画像を読み込み中…');
  let added = 0, failed = 0, blocked = 0;

      const thumb = await compressImage(f, 220, .66);

function compressImage(file, max, q){
  return new Promise((res,rej)=>{
    const img = new Image();
    const fr = new FileReader();
    fr.onload = ()=>{ img.src = fr.result; };
    fr.onerror = rej;
    img.onload = ()=>{
      let w=img.width, h=img.height;
      const sc = Math.min(1, max/Math.max(w,h));
      w=Math.round(w*sc); h=Math.round(h*sc);
      const cv=document.createElement('canvas');
      cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      res(cv.toDataURL('image/jpeg', q));
    };
    img.onerror = rej;
    fr.readAsDataURL(file);
  });
}

/* ---- 自動バックアップ＋端末の連携（復元コード方式・ログインなし） ----

   同じ復元コードの端末どうし（スマホとPCなど）は、保管庫を読む→手元と合わせる→書き戻す、で自動で揃う。
   ・合わせ方: 併せは新しい方（updatedAt）、消した併せは消したまま、忘れ物・表示名はあとから変えた方、主催の印は両方
   ・同時に書いたら（版番号が違う＝409）読み直して合わせ直す

async function bkKeys(code){

  const keyRaw = await crypto.subtle.digest('SHA-256', enc.encode('awase-bk-key:' + n));

async function bkZip(u8, on){
  if(typeof CompressionStream === 'undefined') return null;

async function bkPack(obj, key){
  let body = new TextEncoder().encode(JSON.stringify(obj)), flag = 0;
  const z = await bkZip(body, true).catch(()=>null);
  if(z){ body = z; flag = 1; }
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, body));
  const out = new Uint8Array(2 + iv.length + ct.length);
  out[0] = 1; out[1] = flag; out.set(iv, 2); out.set(ct, 14);

async function bkUnpack(b64, key){

  const body = u[1] === 1 ? await bkZip(pt, false) : pt;
  return JSON.parse(new TextDecoder().decode(body));

/* 手元（a）と保管庫（b）を合わせる */
function vMerge(a, b){
  if(!b) return a;
  const now = Date.now();
  const deleted = Object.assign({}, b.deleted||{});
  Object.entries(a.deleted||{}).forEach(([k,t])=>{ deleted[k] = Math.max(deleted[k]||0, t); });
  Object.keys(deleted).forEach(k=>{ if(now - deleted[k] > 180*86400000) delete deleted[k]; });
  const map = {};
  (b.events||[]).concat(a.events||[]).forEach(e=>{   // 後ろ（手元）が同点なら勝つ
    if(!e || !e.id) return;
    if(deleted[e.id] && deleted[e.id] >= (e.updatedAt||0)) return;
    const cur = map[e.id];
    if(!cur || (e.updatedAt||0) >= (cur.updatedAt||0)) map[e.id] = e;
  });
  const pick = (x, y)=> ((x && x.at)||0) >= ((y && y.at)||0) ? x : y;
  const items = (a.items && a.items.at) || !(b.items && b.items.list) ? pick(a.items, b.items) : b.items;
  return {
    v: 2,
    identity: (b.identity && b.identity.me) ? b.identity : a.identity,   // 保管庫の端末IDにそろえる（主催の権限もそのまま使える）
    events: Object.values(map).sort((x,y)=>String(x.id).localeCompare(String(y.id))),
    owned: Object.assign({}, b.owned||{}, a.owned||{}),
    deleted,
    items: items || {at:0, list:null},
    name: (a.name && a.name.v && (a.name.at||0) >= ((b.name && b.name.at)||0)) ? a.name : (b.name && b.name.v ? b.name : a.name),
    tw: pick(a.tw, b.tw) || {at:0, v:''},
    hidden: Object.assign({}, b.hidden||{}, a.hidden||{}),
    terms: [a.terms||'', b.terms||''].sort().pop()
  };
}

/* 合わせた結果を手元に反映する */
async function vApply(m){
  /* 端末IDが変わる＝別の端末とつないだ。この端末で主催していた併せは、新しい端末IDを副主催にしてから切り替える
     （主催の権限を持ったまま、つないだ先と同じ端末IDで動けるように） */
  if(m.identity && m.identity.me && m.identity.me !== clientId()){
    const mine = state.events.filter(e=>isOwner(e) && e.shared && e.sync && e.sync.room);
    for(const e of mine){
      try{ await apiPost({op:'set', r:e.sync.room, p:'roster/'+m.identity.me, val:{name: myName()||'主催', at: Date.now(), sub: true}}); }catch(err){}
    }
    lsSet('awaseClient', m.identity.me);
    lsSet('awaseSec', m.identity.ms);
    Object.values(conns).forEach(R=>{ R.v = -1; });
  }
  const before = new Set(state.events.map(e=>e.id));
  const localById = {}; state.events.forEach(e=>{ localById[e.id] = e; });
  /* 画像を外して送った分は、手元の画像を残す */
  state.events = m.events.map(e=>{
    const l = localById[e.id];
    if(l && (l.updatedAt||0) === (e.updatedAt||0)) return l;
    return e;
  });
  own.set(m.owned || {});
  lsSet('awaseDeleted', JSON.stringify(m.deleted || {}));
  if(m.items && m.items.list){ lsSet('awaseMyItems', JSON.stringify(m.items.list)); lsSet('awaseMyItemsAt', String(m.items.at||0)); }
  if(m.name && m.name.v){ lsSet('awaseName', m.name.v); lsSet('awaseNameAt', String(m.name.at||0)); }
  if(m.tw && m.tw.at){ lsSet('awaseTw', m.tw.v||''); lsSet('awaseTwAt', String(m.tw.at)); }
  lsSet('awaseHidden', JSON.stringify(m.hidden || {}));
  if(m.terms) lsSet('awaseTerms', m.terms);
  try{ localStorage.setItem('awasePlanner', JSON.stringify(state)); }catch(e){}   // store.set は使わない（また同期が走るため）
  if(syncReady()) state.events.forEach(e=>{ if(!before.has(e.id)) connectEvent(e); });
  if(cur && !state.events.some(e=>e.id===cur)){ cur = null; openStart(); }
  else{
    updateSavedBar();
    const typing = document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if(cur && !typing && !document.querySelector('#modalHost .modal')) renderTab();
  }
}
/* 保管庫と揃える（読む→合わせる→必要なら書く） */
async function vSync(){
  if(!bkAvailable()) return;
  if(vBusy){ vAgain = true; return; }
  vBusy = true;
  try{
    const {id, key} = await bkKeys(bkCode());
    let res;
    try{ res = await apiPost({op:'vget', id, have: vVer}); }
    catch(err){ if(err && err.status===404) res = {ver:0, none:true}; else throw err; }
    let remote = null;
    if(res.none){ vVer = 0; vCache = null; }
    else if(res.blob){
      remote = await bkUnpack(res.blob, key);
      if(remote && remote.keys) remote = vFromV1(remote);
      vVer = res.ver; vCache = remote;
    }else remote = vCache;
    const local = vLocal();
    const merged = vMerge(local, remote);
    if(!vSame(merged, local)) await vApply(merged);
    if(!remote || !vSame(merged, remote)){
      try{
        const r = await apiPost({op:'vput', id, blob: await bkPack(merged, key), ver: vVer});
        vVer = r.ver; vCache = merged;
      }catch(err){
        if(err && err.status===409){ vVer = -1; vAgain = true; }   // 別の端末が先に書いた → 読み直して合わせ直す
        else throw err;
      }
    }
    lsSet('awaseBkAt', String(Date.now()));
  }catch(err){
    console.warn('sync/backup failed:', err);
    clearTimeout(bkTimer); bkTimer = setTimeout(vSync, 5*60000);   // 圏外などは5分後にもう一度
  }finally{
    vBusy = false;
    if(vAgain){ vAgain = false; setTimeout(vSync, 400); }
  }
}

async function vLinkWithCode(code){
  if(!bkAvailable()){ toast('いまは引き継げません（通信できる状態でお試しください）'); return; }
  const n = bkNorm(code);
  if(n.length !== 16){ toast('復元コードは16文字です'); return; }
  try{
    const {id, key} = await bkKeys(n);
    const res = await apiPost({op:'vget', id, have: -1});
    let remote = await bkUnpack(res.blob, key);
    if(remote && remote.keys) remote = vFromV1(remote);
    const cnt = (remote.events||[]).length;
    const mine = state.events.filter(hasContent).length;
    if(!confirm(`併せ ${cnt} 件のデータが見つかりました。\nこの端末に引き継ぎますか？${mine? `\n（この端末にある ${mine} 件の併せも残して、合わせます）` : ''}`)) return;
    lsSet('awaseBkCode', bkFormat(n));
    vVer = 0; vCache = null;

  }catch(err){
    console.warn(err);
    toast(err && err.status===404 ? 'このコードのデータが見つかりません。コードを確かめてください' : '引き継げませんでした。コードと通信状態を確かめてください');

/* ▼▼▼ 同期サーバー設定 ▼▼▼
   SYNC_API: ロリポップ（jyounetsu.site）の同期・画像 API（hosting-lolipop/awase/api/index.php）。

   WEB_BASE: 招待リンクの行き先＝WEB版。アプリ・フル版から招待しても、相手はブラウザで開くだけで参加できる。
*/
const LOCAL_TEST = /^(localhost|127\.0\.0\.1)$/.test(location.hostname); // 手元の検証サーバーで開いたときだけ
const SYNC_API = LOCAL_TEST ? location.origin + '/awase/api/' : 'https://jyounetsu.site/awase/api/';
const WEB_BASE = LOCAL_TEST ? location.origin + '/awase/' : 'https://jyounetsu.site/awase/';
/* ▲▲▲ ここまで ▲▲▲ */

const BRANCHES = ['meta','shots','comments','pending','roster']; // 受信対象
const PUSH_BRANCHES = ['meta','shots','comments','pending'];      // 一括送信対象（rosterは端末ごとの個別書き込みのみ）
const conns = {};        // eventId -> 部屋の接続（roomRef）
const pushTimers = {};

function syncReady(){ return !!SYNC_API; }
function imgApiReady(){ return !!SYNC_API; }

/* ---- サーバーとの通信 ----
   POST の本文は base64url(JSON)・Content-Type は text/plain。
   ロリポップの WAF（入力文の <script> 等で弾く）と、CORS のプリフライト（OPTIONS が PHP に届かない）を避けるため。 */
function b64u(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for(let i=0;i<bytes.length;i+=0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+0x8000));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
/* 端末の秘密（画面にもデータにも出さない）。端末ID（clientId＝公開）と組でサーバーが端末を見分ける。
   主催・副主催かどうか、どの枠の本人かはサーバーがこの組で確かめる（利用者は何も入力しない） */
function deviceSecret(){
  try{
    let s = localStorage.getItem('awaseSec');
    if(!s){
      s = Array.from(crypto.getRandomValues(new Uint8Array(24)), b=>('0'+b.toString(16)).slice(-2)).join('');
      localStorage.setItem('awaseSec', s);
    }
    return s;
  }catch(e){ return ''; }
}
async function apiPost(obj){
  obj = Object.assign({me: clientId(), ms: deviceSecret()}, obj);
  const r = await fetch(SYNC_API, {method:'POST', headers:{'Content-Type':'text/plain'}, body: b64u(JSON.stringify(obj))});
  if(!r.ok) throw Object.assign(new Error('api '+r.status), {status:r.status});
  return r.json();
}

/* ---- 部屋の接続（Firebase の ref と同じ使い方: child(path).set / on / off / once） ----
   受信はポーリング。サーバーの版番号(v)が変わったときだけ中身を受け取り、
   変わったブランチのリスナーだけを呼ぶ。書き込みは部屋ごとに順番に送る（追い越し防止）。 */
function roomRef(room, isOwnerFn){
  const R = {
    room, v:-1, tree:null, ls:{}, chain:Promise.resolve(), inflight:null,
    pending:0, wseq:0, // 送信中の書き込み数・書き込み通番（受信と書き込みの追い越し対策）
    failed:{},         // 送れなかった書き込み（path→値）。電波が戻ったら送り直す
    child(path){
      return {
        set: val => R.set(path, val),
        on: (_ev, cb) => { R.ls[path] = cb; if(R.tree) R.fire(path, R.get(path)); },
        off: () => { delete R.ls[path]; },
        child: sub => R.child(path + '/' + sub)
      };
    },
    get(path){
      let n = R.tree;
      for(const k of path.split('/')){ if(n==null || typeof n!=='object') return null; n = n[k]; }
      return n===undefined ? null : n;
    },
    put(path, val){
      if(!R.tree || typeof R.tree!=='object') R.tree = {};
      const ks = path.split('/'); let n = R.tree;
      for(let i=0;i<ks.length-1;i++){
        if(n[ks[i]]==null || typeof n[ks[i]]!=='object'){ if(val==null) return; n[ks[i]] = {}; }
        n = n[ks[i]];
      }
      if(val==null) delete n[ks[ks.length-1]]; else n[ks[ks.length-1]] = val;
    },
    set(path, val){
      val = val==null ? null : JSON.parse(JSON.stringify(val));
      R.put(path, val); // 手元の写しにも反映（次の受信で自分の書き込みを「変更」と誤認しない）
      delete R.failed[path];
      R.pending++; R.wseq++;
      R.chain = R.chain.then(()=>apiPost({op:'set', r:room, p:path, val, own: !!(isOwnerFn && isOwnerFn())}))
        .then(res=>{
          if(res && res.scrub){ R.v = -1; return; } // 運営が削除した内容をサーバーが取り除いた → 次の受信で全体を取り直す
          if(res && res.v===R.v+1) R.v = res.v;      // 間に他人の書き込みがあれば次の受信で取り直す
        })
        .catch(err=>{
          console.warn('push error:', err);
          /* 410＝運営が削除した併せ（送り直さない）。それ以外は電波が戻ったら送り直す */
          if(err && (err.status===410 || err.status===403)) return; // 削除された併せ／権限のない書き込みは送り直さない
          if(!(path in R.failed)) R.failed[path] = val;
        })
        .finally(()=>{ R.pending--; });
      return R.chain;
    },
    fetch(){
      if(R.inflight) return R.inflight;
      const seq = R.wseq;
      R.inflight = apiPost({op:'get', r:room, v:R.v})
        .then(res=>{
          if(!('d' in res)) return false;
          /* 受信中に自分の書き込みが走った／古い版が遅れて届いた → 捨てて次の受信で取り直す（自分の変更を古い中身で消さない） */
          if(R.pending>0 || R.wseq!==seq || (res.v < R.v && res.v !== 0)) return false;
          const old = R.tree;
          R.tree = res.d; R.v = res.v;
          let changed = false;
          Object.keys(R.ls).forEach(path=>{
            const a = old==null ? undefined : JSON.stringify(R.getFrom(old, path));
            const b = R.get(path);
            if(a !== JSON.stringify(b)){ changed = true; R.fire(path, b); }
          });
          return changed;
        })
        .finally(()=>{ R.inflight = null; });
      return R.inflight;
    },
    fire(path, val){ try{ R.ls[path] && R.ls[path]({ val: ()=>val }); }catch(err){ console.warn(err); } },
    getFrom(tree, path){
      let n = tree;
      for(const k of path.split('/')){ if(n==null || typeof n!=='object') return null; n = n[k]; }
      return n===undefined ? null : n;
    },
    retryFailed(){
      Object.keys(R.failed).forEach(path=>{ const val = R.failed[path]; R.set(path, val); });
    },
    once(){ return R.fetch().then(()=>({ val: ()=>R.tree })); }
  };
  return R;
}

/* ポーリング: 画面が見えている間だけ。開いている併せは直近に変化があれば 6 秒、静かなら 30 秒間隔。
   開いていない併せは 1 分に 1 回（サーバーの同時アクセスを抑える） */
const POLL_FAST = 6000, POLL_SLOW = 30000, POLL_BG = 60000;
let lastRemoteChange = Date.now();
let pollTimer = null;
function pollAll(){
  clearTimeout(pollTimer);
  const now = Date.now();
  const rooms = Object.entries(conns).filter(([id, R])=> id===cur || now - (R.polledAt||0) >= POLL_BG - 1000).map(([id, R])=>R);
  const next = ()=>{ pollTimer = setTimeout(pollAll, (Date.now()-lastRemoteChange < 300000) ? POLL_FAST : POLL_SLOW); };
  if(document.hidden || !rooms.length){ next(); return; }
  rooms.forEach(R=>{ R.polledAt = now; });
  Promise.all(rooms.map(R=>R.fetch().then(ch=>{ R.retryFailed(); return ch; }).catch(()=>false)))
    .then(rs=>{ if(rs.some(Boolean)) lastRemoteChange = Date.now(); })
    .finally(next);
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ lastRemoteChange = Date.now(); pollAll(); } });

/* ---- ブランチ分割同期 ----
   コスト構造上の要:  イベント全体をset()せず、meta(要項)/shots(構図)/
   comments(コメント)/pending(申請) を別ノードで差分同期する。
   画像本体はサーバーの画像URL参照のみで、同期データには載せない。 */

function arrify(v){
  if(v==null) return [];
  const a = Array.isArray(v) ? v : Object.values(v);
  return a.filter(x=>x!=null);
}
function stripNulls(x){
  if(Array.isArray(x)) return x.map(stripNulls);
  if(x && typeof x==='object'){
    const o={};
    Object.keys(x).forEach(k=>{ if(x[k]!=null) o[k]=stripNulls(x[k]); });
    return o;
  }
  return x;
}
function cleanMeta(e){
  const m = JSON.parse(JSON.stringify(e));
  delete m.id; delete m.sync; delete m.shots; delete m.pending; delete m.comments; delete m.roster;
  delete m.bg; // 背景のdataURLはRTDBに載せない（R2のbgUrlのみ同期）
  delete m.shared; // 端末の印（ほかの参加者には関係ない）
  return m;
}
const SHOT_DEFAULTS = {img:null,timg:null,url:null,turl:null,cap:'',done:false,prio:0,by:'',byId:'',at:0};
function normShot(s){ return Object.assign({}, SHOT_DEFAULTS, s); }

function branchPayload(e, branch){
  if(branch==='meta') return stripNulls(cleanMeta(e));
  if(branch==='roster') return stripNulls(e.roster||{});
  if(branch==='comments'){
    const map = {};
    Object.keys(e.comments||{}).forEach(k=>{ const a=arrify(e.comments[k]); if(a.length) map[k]=a; });
    return {by: clientId(), at: Date.now(), map: stripNulls(map)};
  }
  const list = branch==='shots' ? e.shots : (e.pending||[]);
  return {by: clientId(), at: Date.now(), list: stripNulls(list)};
}

function pushBranch(e, branch, now){
  if(!e || !syncReady() || !conns[e.id]) return;
  const key = e.id + ':' + branch;
  clearTimeout(pushTimers[key]);
  const doPush = ()=>{
    try{ conns[e.id].child(branch).set(branchPayload(e, branch)); }
    catch(err){ console.warn('push error:', err); }
  };
  if(now) doPush();
  else pushTimers[key] = setTimeout(doPush, 600);
}
function pushAll(e){ PUSH_BRANCHES.forEach(b=>pushBranch(e, b, true)); }
/* 旧APIとの互換: save()（要項の編集）からはmetaだけ流す */
function schedulePush(e){ pushBranch(e, 'meta'); }

function applyMeta(local, v){
  if(!v || !(v.updatedAt > (local.updatedAt||0))) return false;
  const base = cleanMeta(blankEvent());
  Object.keys(base).forEach(k=>{
    if(k==='bg') return; // 端末内の背景dataURLはリモートで消さない
    local[k] = (v[k]!==undefined) ? v[k] : base[k];
  });
  ['recruits','members','cameras','assistants','subHosts','timetable','dataLinks'].forEach(k=>{ local[k] = arrify(local[k]); });
  if(!local.sec || typeof local.sec!=='object') local.sec = {};
  local.members.forEach(m=>{ if(!m.prog) m.prog={ish:0,wig:0,item:0}; });
  return true;
}
function onRemote(id, branch, v){
  const local = state.events.find(x=>x.id===id);
  if(!local) return;
  /* 自分の書き込みのエコーは無視（clientIdで判定） */
  if(v && v.by === clientId() && branch!=='meta' && branch!=='roster') return;
  let changed = false;
  if(branch==='roster'){
    const map = v || {};
    const me = map[clientId()];
    if(me && me.ban && !isOwner(local)){ leaveKicked(local); return; }
    if(JSON.stringify(map) !== JSON.stringify(local.roster||{})){ local.roster = map; changed = true; }
  }else if(branch==='meta'){
    changed = applyMeta(local, v);
  }else if(branch==='comments'){
    const map = {};
    const src = (v && v.map) || {};
    Object.keys(src).forEach(k=>{ map[k] = arrify(src[k]); });
    if(JSON.stringify(map) !== JSON.stringify(local.comments||{})){ local.comments = map; changed = true; }
  }else{
    const list = arrify(v && v.list).map(branch==='shots'? normShot : (x=>x));
    const key = branch; // shots | pending
    if(JSON.stringify(stripNulls(list)) !== JSON.stringify(stripNulls(local[key]||[]))){ local[key] = list; changed = true; }
  }
  if(changed){
    store.set(state);
    if(cur===id) renderTab();
    updateSavedBar();
  }
  if(branch==='meta') tryJoinClaim(local);
}
function adoptRemote(local, v){
  if(v.meta) applyMeta(local, Object.assign({}, v.meta, {updatedAt: Math.max(v.meta.updatedAt||0, (local.updatedAt||0)+1)}));
  local.shots = arrify(v.shots && v.shots.list).map(normShot);
  local.pending = arrify(v.pending && v.pending.list);
  local.roster = (v.roster) || {};
  const map = {};
  Object.keys((v.comments && v.comments.map) || {}).forEach(k=>{ map[k] = arrify(v.comments.map[k]); });
  local.comments = map;
  store.set(state);
  if(cur===local.id) renderTab();
  updateSavedBar();
  tryJoinClaim(local);
}

/* ---- 参加者名簿と退出（キック） ----
   参加した端末は roster/{clientId} に自分の名前を登録する（端末ごとの個別書き込み・全体setはしない）。
   主催が ban フラグを立てると、相手の端末では併せが削除され、同じリンクでは再参加できない。 */
function registerRoster(e){
  if(!syncReady() || !conns[e.id]) return;
  const cid = clientId();
  const cur0 = (e.roster||{})[cid];
  if(cur0 && cur0.ban) return;
  const nm = myName() || (isOwner(e)? '主催' : (isSub(e)? '副主催' : ''));
  if(cur0 && cur0.name===nm) return;
  const entry = {name:nm, at:(cur0 && cur0.at)||Date.now()};
  if(isOwner(e)) entry.own = true;
  if(cur0 && cur0.sub) entry.sub = true; // 副主催の任命は名前の書き換えで消さない
  try{ conns[e.id].child('roster/'+cid).set(entry); }catch(err){}
}
function leaveKicked(e){
  disconnectEvent(e.id);
  state.events = state.events.filter(x=>x.id!==e.id);
  store.set(state);
  updateSavedBar();
  toast('主催の操作により、この併せから退出となりました');
  if(cur===e.id){ cur=null; openStart(); }
}
function kickMember(cid){
  const e = ev();
  if(!e || !canHost(e)) return;
  const r = (e.roster||{})[cid];
  /* 副主催は主催に手出しできない（主催だけが上位） */
  if(r && r.own && !isOwner(e)){ toast('主催に退出してもらうことはできません'); return; }
  if(!confirm(`${(r && r.name)||'この参加者'} さんに退出してもらいますか？\n相手の端末からこの併せが消え、同じリンクでは再参加できません。進捗の枠も解放されます。`)) return;
  let metaChanged = false;
  e.members.concat(e.cameras).forEach(m=>{
    if(m.claim===cid || (m.claims||[]).includes(cid)){
      delete m.claim;
      delete m.claims; // 本人の全端末の接続を解除
      if(m.ikey) m.ikey = uid(); // 古い個別リンクを無効化（再招待時は新リンクをコピー）
      metaChanged = true;
    }
  });
  if(!e.roster) e.roster = {};
  if(!e.roster[cid]) e.roster[cid] = {name:'', at:Date.now()};
  e.roster[cid].ban = true;
  store.set(state);
  if(conns[e.id]){ try{ conns[e.id].child('roster/'+cid).set(stripNulls(e.roster[cid])); }catch(err){} }
  if(metaChanged){ e.updatedAt = Date.now(); pushBranch(e,'meta'); }
  renderTab();
  toast('退出処理を行いました');
}
function unkickMember(cid){
  const e = ev();
  if(!e || !canHost(e) || !e.roster || !e.roster[cid]) return;
  delete e.roster[cid].ban;
  store.set(state);
  if(conns[e.id]){ try{ conns[e.id].child('roster/'+cid+'/ban').set(null); }catch(err){} }
  renderTab();
  toast('再参加できるようにしました');
}

/* ---- 副主催 ----
   主催と同じ操作（募集シートの編集・構図の管理・進捗・招待リンク・参加者の退出）ができる端末。
   主催に対してだけは何もできない（退出も副主催の解除も不可）。
   端末単位（clientId）なので、同じ人でも別の端末で参加し直したら任命し直す。 */
function setSub(cid, on){
  const e = ev();
  if(!e || !canHost(e)) return;
  const r = (e.roster||{})[cid];
  if(!r) return;
  if(r.own){ toast('主催の権限は変えられません'); return; }
  if(r.ban){ toast('退出した方は副主催にできません'); return; }
  const nm = r.name || 'この参加者';
  if(!confirm(on
    ? nm + ' さんを副主催にしますか？\n募集シートの編集・構図の管理・招待リンク・参加者の退出まで、主催と同じ操作ができるようになります。'
    : nm + ' さんの副主催を解除しますか？')) return;
  if(on) r.sub = true; else delete r.sub;
  store.set(state);
  if(conns[e.id]){ try{ conns[e.id].child('roster/'+cid+'/sub').set(on? true : null); }catch(err){} }
  renderTab();
  toast(on? '副主催にしました' : '副主催を解除しました');
}

/* イベントを開いた/起動した時に裏で自動接続（ユーザー操作不要） */
async function connectEvent(e){
  if(!e || !syncReady() || conns[e.id]) return;
  if(liteHost(e)) return; // WEB版で作った併せ＝「作成だけ」。サーバーには上げない
  if(!e.sync || !e.sync.room){ e.sync = {room: roomId()}; store.set(state); }
  const base = roomRef(e.sync.room, ()=>isOwner(state.events.find(x=>x.id===e.id)));
  conns[e.id] = base;
  base.once('value').then(snap=>{
    const v = snap.val();
    const local = state.events.find(x=>x.id===e.id);
    if(!local){ delete conns[e.id]; return; }
    /* 退出済み端末は接続せず、ローカルからも削除する */
    const rme = v && v.roster && v.roster[clientId()];
    if(rme && rme.ban && !isOwner(local)){ leaveKicked(local); return; }
    const remoteAt = (v && v.meta && v.meta.updatedAt) || 0;
    if(!v){
      if(hasContent(local) && isOwner(local)) pushAll(local);
    }else if(remoteAt >= (local.updatedAt||0)){
      adoptRemote(local, v);
    }else{
      pushAll(local);
    }
    BRANCHES.forEach(b=>{
      base.child(b).on('value', s=>onRemote(e.id, b, s.val()), err=>console.warn('sync error:', err));
    });
    if(isOwner(local) && !local.shared){ local.shared = true; store.set(state); }
    registerRoster(local);
    pollAll();
  }).catch(err=>{
    console.warn('sync error:', err);
    delete conns[e.id]; // 圏外などで最初の受信に失敗 → 次に開いたとき／画面に戻ったときに繋ぎ直す
  });
}
function disconnectEvent(id){
  const base = conns[id];
  if(base){
    BRANCHES.forEach(b=>{ try{ base.child(b).off(); }catch(e){} });
    delete conns[id];
  }
}

/* ---- 個別招待リンク（メンバー枠との自動紐づけ） ----
   主催が枠ごとの専用リンク(#join=room&m=ikey)を本人のXアカウントへDMで送る。
   開いた端末は同期完了時にその枠を自動claimし、表示名も名簿から設定される。 */
function joinClaimMap(){ try{ return JSON.parse(localStorage.getItem('awaseJoinClaim'))||{}; }catch(e){ return {}; } }
function setJoinClaim(room, key){
  const m = joinClaimMap();
  if(key==null) delete m[room]; else m[room] = key;
  try{ localStorage.setItem('awaseJoinClaim', JSON.stringify(m)); }catch(e){}
}
/* 個別リンクの枠キーでサーバーに枠を取ってもらう（どの枠かの照合も1端末1枠の確認もサーバー側。
   枠キーは主催・副主催以外には配られないので、手元では照合できない） */
const claimBusy = {};
function tryJoinClaim(e){
  if(!e || !e.sync || !e.sync.room || !syncReady()) return;
  const room = e.sync.room;
  const key = joinClaimMap()[room];
  if(!key || claimBusy[room]) return;
  claimBusy[room] = true;
  apiPost({op:'claim', r:room, key, name: myName()})
    .then(res=>{
      setJoinClaim(room, null);
      if(res.name && !myName()) setMyName(res.name);
      const R = conns[e.id];
      if(R){ R.v = -1; R.fetch().catch(()=>{}); }   // 取った枠・副主催の権限を受け取り直す
      toast(res.kind==='subHosts' ? 'この端末が副主催になりました' : `「${res.chara||res.name||'メンバー'}」の枠にこの端末で接続しました`);
    })
    .catch(err=>{
      const st = err && err.status;
      if(st===404){ setJoinClaim(room, null); toast('この招待リンクの枠が見つかりません（主催に確認してください）'); }
      else if(st===409){ setJoinClaim(room, null); toast('この端末はすでに別の枠で参加しています'); }
      else if(st===403){ setJoinClaim(room, null); }
      /* それ以外（圏外など）は次の受信でもう一度 */
    })
    .finally(()=>{ delete claimBusy[room]; });
}
/* 募集シートから副主催の枠を消したとき、その枠で繋がっていた端末の権限を外す */
function revokeSubSlot(slot){
  const e = ev();
  if(!e || !slot) return;
  const cids = [slot.claim].concat(slot.claims||[]).filter(Boolean);
  cids.forEach(cid=>{
    if(e.roster && e.roster[cid]) delete e.roster[cid].sub;
    if(conns[e.id]){ try{ conns[e.id].child('roster/'+cid+'/sub').set(null); }catch(err){} }
  });
}
/* ---- 招待メッセージ（受け取った人が一目で「誰から・どの併せ・何役で」か分かる文面を自動で作る） ----
   role: 'キャラ名役' / 'カメラマン' / '副主催' / null（共通リンク）。日程・場所は募集シートで表示ONのものだけ */
function inviteMessage(e, role, url, personal){
  const host = (e.host||'').trim();
  const title = (e.title||'').trim() || '併せ';
  const from = host ? `${host}さんから` : '';
  const lines = [role
    ? `${from}「${title}」の${role}で招待が届きました！`
    : `${from}「${title}」への招待が届きました！`];
  if(secOn(e,'date')){ const d = dateDisp(e); if(d && d!=='日程未定') lines.push('📅 ' + d); }
  if(secOn(e,'place')){ const pl = (e.studio||e.place||'').trim(); if(pl) lines.push('📍 ' + pl); }
  lines.push('');
  lines.push(personal
    ? 'このリンクを開くだけで参加できます（あなた専用のリンクです。ほかの人には送らないでください）'
    : 'このリンクを開くだけで参加できます');
  lines.push(url);
  return lines.join('\n');
}

/* 招待リンクの「送った」チェック（この端末だけ。枠キー ikey ごと＝行を消したり並べ替えてもずれない） */
function invCopied(btn){ if(btn){ btn.textContent = 'コピーしました'; setTimeout(()=>{ btn.textContent = 'リンクをコピー'; }, 2500); } }
function invSentMap(){ return lsJson('awaseInvSent', {}); }
function invSentToggle(el, kind, i){

function invRow(kind, i, label, fn){

}

/* ---- 招待（メンバー・カメラマン向け） ---- */
function inviteURL(e){
  /* どこから招待しても行き先は WEB版（相手はアプリが無くてもブラウザで参加できる） */
  return WEB_BASE + '#join=' + e.sync.room;
}
function showInvite(){
  const e = ev();
  if(!e) return;
  /* 初めて招待するとき（＝主催として続ける併せができたとき）に、復元コードを一度だけ案内する */
  if(!bkNoticed() && bkAvailable() && canHost(e)){
    bkMarkNoticed();
    showBkCode(true, 'showInvite()');
    return;
  }
  if(!syncReady()){
    document.getElementById('modalHost').innerHTML = `
    <div class="modal" onclick="if(event.target===this)closeModal()">
      <div class="box">
        <h3>メンバーを招待</h3>
        <div style="font-size:13.5px;line-height:1.8">

          共有サーバーを設定すると、メンバーは<b>リンクを開くだけ</b>で同じデータに繋がり、構図の共有・コメント・「撮れた！」チェックがリアルタイムで全員に反映されます（LINEのような使い心地になります）。<br><br>
          設定は配布元（主催者向けガイド）をご覧ください。
        </div>
        <button class="btn sec wide" onclick="closeModal()">閉じる</button>
      </div>

  /* 枠キー(ikey)は「リンクをコピー」した時点で発行される（＝その枠は手動claim不可にロック） */
  const url = inviteURL(e);
  const shareText = inviteMessage(e, null, url, false);
  document.getElementById('modalHost').innerHTML = `
  <div class="modal" onclick="if(event.target===this)closeModal()">
    <div class="box">
      <h3>メンバーを招待</h3>
      ${url && canHost(e) && e.members.length? `
      <div class="note" style="margin:0 0 4px">リンクをコピーして本人に送ったら「送った」にチェックを付けておくと、送り忘れ・送り間違いを防げます（チェックはこの端末だけに残ります）。</div>
      <div class="invbox">
      <div class="invh">メンバー別の招待リンク</div>
      <div class="note">確定メンバー本人のXアカウントへDMで送ってください。開いた人は<b>その枠に自動で紐づき、名前の入力も不要</b>です。</div>
      ${e.members.map((m,i)=>invRow('members', i, `${esc(m.chara)||('枠'+(i+1))}${m.name?'　'+esc(m.name):''}`, 'copyMemberInvite')).join('')}
      </div>
      ${(e.subHosts||[]).filter(h=>h.name).length?`<div class="invbox">
      <div class="invh">副主催の招待リンク</div>
      <div class="note">開いた時点で主催と同じ操作ができるようになります。信頼できる方にだけ送ってください。</div>
      ${(e.subHosts||[]).map((h,i)=>h.name? invRow('subHosts', i, `${esc(h.name)}さん`, 'copySubInvite') : '').join('')}
      </div>`:''}
      ${e.cameras.filter(c=>c.name).length?`<div class="invbox">
      <div class="invh">カメラマン別の招待リンク</div>
      <div class="note">本人に送ると、その方だけが自分の撮影データ欄を編集できるようになります。</div>
      ${e.cameras.map((c,i)=>c.name? invRow('cameras', i, `${esc(c.name)}さん`, 'copyCameraInvite') : '').join('')}
      </div>`:''}
      <div class="invbox" style="margin-bottom:12px">
      <div class="invh">共通の招待リンク</div>
      <div class="note">アシスタントなど、枠のない方はこちらを。</div>`:''}
      <div style="font-size:13.5px;line-height:1.8;margin-bottom:10px">
        ${url? (canHost(e)&&e.members.length? '' : 'このリンクをLINEやDMで送るだけ。<br>相手は<b>開くだけで参加完了</b>です！')
             : 'この招待コードをLINEやDMで送ってください。'}
      </div>
      ${url? `<div style="background:${canHost(e)&&e.members.length?'#fff;border:1px solid #ececef':'var(--acbg)'};border-radius:10px;padding:10px;font-size:12px;word-break:break-all">${esc(url)}</div>`
           : `<div style="background:var(--acbg);border-radius:12px;padding:14px;text-align:center;font-size:22px;font-weight:800;letter-spacing:.05em;color:var(--ac)">${esc(e.sync.room)}</div>`}
      <button class="btn wide" onclick="copyText(${JSON.stringify(shareText).replace(/"/g,'&quot;')})">招待メッセージをコピー</button>
      ${url && canHost(e) && e.members.length? '</div>' : ''}
      <button class="btn sec wide" onclick="closeModal()">閉じる</button>
    </div>
  </div>`;
}
function copyText(t, keep){
  const fallback = ()=>{
    try{
      const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy'); ta.remove();
    }catch(err){}
  };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).catch(fallback); // 権限拒否時もフォールバックでコピー
    }else fallback();
  }catch(err){ fallback(); }
  toast('コピーしました');
  if(!keep) closeModal();
}
function joinPrompt(){
  const code = prompt('招待コード（またはリンク）を貼り付けてください');
  if(code) joinByCode(code);
}
function joinByCode(code, mkey){
  /* WEB版で最初は利用規約を出していない人が「招待コードで参加する」から入るときは、ここで同意してもらう */
  if(!termsOk()){ showTerms(()=>joinByCode(code, mkey)); return; }
  code = String(code||'').trim();
  const m = code.match(/#join=([\w-]+?)(?:&m=([\w-]+))?$/);
  if(m){ code = m[1]; if(!mkey) mkey = m[2]; }
  if(!code){ toast('コードが空です'); return; }
  if(!syncReady()){ toast('共有サーバーが未設定のため参加できません'); return; }
  if(mkey) setJoinClaim(code, mkey);
  let e = state.events.find(x=>x.sync && x.sync.room===code);
  if(!e){
    e = blankEvent();
    e.sync.room = code;
    e.updatedAt = 0; // リモートのデータを必ず受け入れる（この端末は招待者=主催権限なし）
    state.events.push(e);
    store.set(state);
  }
  openEvent(e.id,'info');
  toast('接続中…');
  tryJoinClaim(e);
  /* 個別リンクなら名前は名簿から自動設定される。共通リンクのときだけ表示名を聞く */
  if(!myName() && !mkey) ensureName();
}

/* ---- バックアップ ---- */
function exportJSON(){
  const blob = new Blob([JSON.stringify(state,null,1)], {type:'application/json'});
  const a = document.createElement('a');
  a.download = 'awase_backup_'+new Date().toISOString().slice(0,10)+'.json';
  a.href = URL.createObjectURL(blob);
  a.click();
  toast('保存しました');
}
function importJSON(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='.json,application/json';
  inp.onchange = ()=>{
    const f = inp.files[0];
    if(!f) return;
    const fr = new FileReader();
    fr.onload = ()=>{
      try{
        const d = JSON.parse(fr.result);
        if(d.events){
          d.events.forEach(ne=>{
            const i = state.events.findIndex(x=>x.id===ne.id);
            if(i<0) state.events.push(ne);
            else if((ne.updatedAt||0) > (state.events[i].updatedAt||0)) state.events[i]=ne;
          });
          store.set(state);
          toast('復元しました');
          cur? renderTab() : openStart();
          updateSavedBar();
        }else toast('データ形式が違います');
      }catch(err){ toast('読み込みに失敗しました'); }
    };
    fr.readAsText(f);
  };
  inp.click();
}

/* ---- init ---- */
(function init(){
  const saved = store.get();
  if(saved && saved.events) state = saved;

  /* 既存データの所有マーク（初回のみ）: 同期は今まで無効だったので
     この端末にある併せはすべてこの端末で作られたもの＝主催 */
  try{
    if(localStorage.getItem('awaseOwned') == null){
      const o = {};
      state.events.forEach(e=>{ o[e.id] = true; });
      localStorage.setItem('awaseOwned', JSON.stringify(o));
    }
  }catch(e){}

  state.events.forEach(e=>{
    if(!e.sync || !e.sync.room) e.sync={room: roomId()};
    if(!e.timetable) e.timetable=[];
    if(!e.assistants) e.assistants=[];
    if(!e.sec) e.sec={};
    if(!e.pending) e.pending=[];
    if(!e.comments || typeof e.comments!=='object') e.comments={};
    if(!e.roster || typeof e.roster!=='object') e.roster={};
    if(!e.dataLinks) e.dataLinks=[];
    if(!e.subHosts) e.subHosts=[];
    ['intro','host','hostTw','station','placeUrl','costume','feeLayer','feeCamera','condCommon','condLayer','condCamera','notes','dateText','recCam','recAs','message'].forEach(k=>{ if(e[k]==null) e[k]=''; });
    if(e.fee && !e.feeLayer){ e.feeLayer = e.fee; delete e.fee; }
    if(!e.dateType) e.dateType = e.date ? 'fixed' : 'tbd';
    e.members.forEach(m=>{ if(!m.prog) m.prog={ish:0,wig:0,item:0}; });
    e.shots = (e.shots||[]).map(normShot);
  });
  store.set(state);

  const start = ()=>{
    // 招待リンク (#join=xxx / #join=xxx&m=枠キー) から開いた場合は自動参加、それ以外は要項ページを直接表示
    const m = location.hash.match(/#join=([\w-]+?)(?:&m=([\w-]+))?$/);
    if(m && syncReady()){
      history.replaceState(null,'',location.pathname+location.search);
      joinByCode(m[1], m[2]);
    }else{
      openStart();
    }

    // 開いた時点で全併せを自動同期（LINE的な挙動・操作不要）
    if(syncReady()){
      state.events.forEach(e=>connectEvent(e));
    }
  };
  /* 初回（または規約の改定後）は、利用規約に同意してから始める */
  /* WEB版で「作るだけ」の人は投稿しない（サーバーに上げない）ので利用規約は出さない。
     招待リンクで参加する人（構図リクエスト・コメントを投稿する）にだけ出す */
  const joining = /#join=/.test(location.hash);
  const linkM = location.hash.match(/#link=([A-Za-z0-9-]{16,24})/);
  if(linkM){ history.replaceState(null,'',location.pathname+location.search); setTimeout(()=>vLinkWithCode(linkM[1]), 600); }
  if(termsOk() || (LITE && !joining)) start(); else showTerms(start);
  /* 起動したら、ほかの端末の変更を取りにいく（自動バックアップ・端末の連携） */
  setTimeout(vSync, 1500);
  /* データを消えにくくする: ブラウザに頼む／iPhone のホーム画面版の初回は引き継ぎを聞く／Safari なら 1 回だけ案内 */
  setTimeout(askPersist, 2000);
  if(!linkM && !joining) setTimeout(standaloneWelcome, 1200);
  setTimeout(a2hsHint, 20000);
  /* 画面に戻ったとき、繋がっていない併せ（圏外で失敗した等）を繋ぎ直す */
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && syncReady()) state.events.forEach(e=>connectEvent(e)); });
})();
